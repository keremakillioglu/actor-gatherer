<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ag dashboard</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10); --wash: rgba(11,11,11,0.04);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --t-call: #1f8a3b; --t-output: #74c487; --t-gatherer: #e8b600;
  --good: #0ca30c; --warning: #fab219; --critical: #d03b3b; --selected: rgba(42,120,214,0.10);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --selected: rgba(57,135,229,0.16);
  --t-call: #2ea043; --t-output: #8fd19e; --t-gatherer: #f2cc3a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --selected: rgba(57,135,229,0.16);
  --t-call: #2ea043; --t-output: #8fd19e; --t-gatherer: #f2cc3a;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--ring); background: var(--surface); position: sticky; top: 0; z-index: 2; }
header h1 { font-size: 16px; margin: 0; font-weight: 600; }
header .home { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
header .live { color: var(--ink-2); font-size: 12px; white-space: nowrap; }
button { font: inherit; font-size: 12px; color: var(--ink); background: var(--surface); border: 1px solid var(--ring); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { background: var(--wash); }
.layout { display: grid; grid-template-columns: 320px minmax(0, 1fr); min-height: calc(100vh - 50px); }
aside { border-right: 1px solid var(--ring); background: var(--surface); padding: 12px 0; overflow-y: auto; max-height: calc(100vh - 50px); position: sticky; top: 50px; }
aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 16px 6px; font-weight: 600; }
.gatherer { margin-bottom: 6px; }
.gatherer > .name { padding: 4px 16px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  width: 100%; border: 0; background: none; color: inherit; font: inherit; font-weight: 600; text-align: left; cursor: pointer; }
.gatherer > .name:hover { background: var(--wash); }
.gatherer > .name:focus-visible { outline: 2px solid var(--axis); outline-offset: -2px; }
.gatherer > .name .caret { display: inline-block; width: 12px; color: var(--muted); font-weight: 400; transition: transform .15s; }
.gatherer > .name[aria-expanded="true"] .caret { transform: rotate(90deg); }
.gatherer > .name span { color: var(--muted); font-weight: 400; font-size: 12px; }
.agent { display: block; width: 100%; text-align: left; border: 0; border-radius: 0; background: none; padding: 7px 16px 7px 24px; cursor: pointer; }
.agent:hover { background: var(--wash); }
.agent[aria-current="true"] { background: var(--selected); }
.agent .top { display: flex; align-items: center; gap: 8px; }
.agent .harness { font-weight: 600; white-space: nowrap; }
.agent .id { color: var(--ink-2); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.agent .asked { font-size: 12px; color: var(--ink-2); margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; overflow-wrap: anywhere; }
.agent .meta { color: var(--muted); font-size: 12px; padding-left: 0; margin-top: 2px; }
.status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.status i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--axis); }
.status.running i { background: var(--good); }
.status.building i { background: var(--warning); }
.status.failed i { background: var(--critical); }
.servers { padding: 0 16px; color: var(--ink-2); font-size: 12px; }
main { padding: 20px; min-width: 0; }
.empty { color: var(--muted); padding: 40px; text-align: center; }
.title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.title h2 { margin: 0; font-size: 18px; font-weight: 600; }
.title .sub { color: var(--muted); font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 12px 14px; }
.tile .label { color: var(--ink-2); font-size: 12px; }
.tile .value { font-size: 22px; font-weight: 600; margin-top: 2px; }
.tile .note { color: var(--muted); font-size: 12px; margin-top: 2px; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; min-width: 0; }
.card h3 { margin: 0 0 2px; font-size: 14px; font-weight: 600; }
.card .desc { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.key-line { width: 14px; height: 2px; border-radius: 1px; display: inline-block; }
.key-rect { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.key-rule { width: 1px; height: 12px; display: inline-block; background: var(--muted); }
.chart { position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.tooltip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12); min-width: 170px; z-index: 3; display: none; }
.tooltip .t { color: var(--muted); margin-bottom: 4px; }
.tooltip .row { display: flex; align-items: center; gap: 8px; }
.tooltip .row b { font-weight: 600; min-width: 64px; }
.tooltip .row span { color: var(--ink-2); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 1100px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 760px) { .layout { grid-template-columns: minmax(0, 1fr); } aside { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--ring); } main { padding: 16px; } }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { text-align: left; color: var(--muted); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
td { padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.total td { font-weight: 600; border-bottom: 0; }
.scroll { overflow-x: auto; }
.tall { max-height: 420px; overflow-y: auto; }
.desc-cell { color: var(--ink-2); max-width: 520px; }
.bar { height: 8px; border-radius: 0 4px 4px 0; background: var(--s1); display: inline-block; vertical-align: middle; }
.stack { display: flex; height: 18px; gap: 2px; margin: 8px 0 10px; }
.stack div { height: 100%; }
.stack div:first-child { border-radius: 4px 0 0 4px; } .stack div:last-child { border-radius: 0 4px 4px 0; }
.stack div:only-child { border-radius: 4px; }
details summary { cursor: pointer; color: var(--ink-2); font-size: 12px; margin-top: 8px; }
.tasks { border-top: 1px solid var(--grid); }
.tasks .thead, .task > summary { display: grid; grid-template-columns: 32px minmax(140px, 220px) minmax(0, 1fr) 150px 60px 96px; gap: 12px;
  padding: 7px 8px; font-size: 12px; align-items: start; }
.tasks .thead { color: var(--muted); border-bottom: 1px solid var(--grid); }
.task > summary { margin: 0; color: var(--ink); cursor: pointer; border-bottom: 1px solid var(--grid); list-style: none; }
.task > summary::-webkit-details-marker { display: none; }
.task > summary:hover { background: var(--wash); }
.task[open] > summary { background: var(--selected); }
.task .tname { font-weight: 500; }
.task .badge { display: inline-block; font-size: 11px; font-weight: 600; color: var(--s1); border: 1px solid currentColor; border-radius: 999px;
  padding: 0 7px; margin-right: 6px; line-height: 16px; vertical-align: 1px; }
.task .tnote { display: block; color: var(--muted); margin-top: 2px; }
.task .n, .tasks .thead .n { text-align: right; font-variant-numeric: tabular-nums; }
.task .messages { padding: 4px 0 10px 44px; }
@media (max-width: 760px) { .tasks .thead { display: none; } .task > summary { grid-template-columns: 24px minmax(0, 1fr); }
  .task > summary > span:nth-child(n+3) { grid-column: 2; } .task .messages { padding-left: 0; } }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--ring); margin: -4px 0 16px; }
.tab { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 8px 14px; font-size: 13px; color: var(--ink-2); margin-bottom: -1px; }
.tab:hover { background: var(--wash); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--s1); font-weight: 600; }
.card-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.decomp { position: relative; margin: 6px 0 14px; display: grid; gap: 8px; }
.drow { display: grid; grid-template-columns: 210px minmax(0, 1fr); align-items: center; gap: 12px; }
.drow .dzero { grid-column: 2; color: var(--muted); font-size: 11px; margin-top: -4px; }
.dlabel { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ink-2); }
.dlabel .dval { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.dbar { height: 22px; display: flex; }
.dinner { display: flex; gap: 2px; height: 100%; }
.dbar > .seg + .seg, .dbar > .dinner + .dinner { margin-left: 2px; }
.seg { height: 100%; min-width: 2px; display: flex; align-items: center; overflow: hidden; cursor: default; outline-offset: 2px; }
.seg:first-child { border-radius: 4px 0 0 4px; } .seg:last-child { border-radius: 0 4px 4px 0; } .seg:only-child { border-radius: 4px; }
.seg:hover, .seg:focus-visible { filter: brightness(1.08); }
.seg span { font-size: 11px; padding: 0 6px; white-space: nowrap; pointer-events: none; }
@media (max-width: 760px) { .drow { grid-template-columns: minmax(0, 1fr); gap: 4px; } .drow .dzero { grid-column: 1; } }
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 4px 0 10px; }
.filters .label { color: var(--muted); font-size: 12px; margin-right: 4px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; color: var(--ink-2); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.chip[aria-pressed="false"] { color: var(--muted); background: none; }
.chip[aria-pressed="false"] .dot { opacity: .35; }
.chip[aria-pressed="true"] { background: var(--selected); border-color: transparent; color: var(--ink); }
.ctx { max-height: 520px; overflow-y: auto; border-top: 1px solid var(--grid); }
.ctx .cols { display: grid; grid-template-columns: 3px minmax(90px, 150px) minmax(0, 1fr) auto; gap: 10px; height: 26px; align-items: center;
  padding: 0 4px; font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--grid); position: sticky; top: 0; background: var(--surface); z-index: 2; }
.ctx .cols .n { text-align: right; }
.ctx .run { display: flex; align-items: center; gap: 8px; padding: 10px 4px 4px; font-size: 12px; position: sticky; top: 26px; background: var(--surface); z-index: 1; }
.ctx .run span:last-child { color: var(--muted); }
.ctx .item summary { display: grid; grid-template-columns: 3px minmax(90px, 150px) minmax(0, 1fr) auto; gap: 10px; align-items: center;
  margin: 0; padding: 5px 4px; border-bottom: 1px solid var(--grid); color: var(--ink); list-style: none; }
.ctx .item summary::-webkit-details-marker { display: none; }
.ctx .item summary:hover { background: var(--wash); }
.ctx .bar-key { width: 3px; height: 16px; border-radius: 2px; }
.ctx .kind { font-size: 12px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctx .preview { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.ctx .preview.none { color: var(--muted); }
.ctx .uncounted { font-size: 12px; color: var(--muted); padding: 4px 4px 10px 17px; }
.ctx .n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ctx pre { margin: 0; padding: 10px 12px 12px 17px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap;
  overflow-wrap: anywhere; color: var(--ink-2); background: var(--page); border-bottom: 1px solid var(--grid); max-height: 360px; overflow-y: auto; }
.warn { color: var(--ink-2); font-size: 12px; margin-top: 8px; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.stale { opacity: .55; transition: opacity .2s; }
</style>
</head>
<body>
<header>
  <h1>ag dashboard</h1>
  <div class="home" id="home"></div>
  <div class="live" id="live"></div>
  <button id="pause" type="button">Pause</button>
</header>
<div class="layout">
  <aside id="agents"></aside>
  <main id="main"><div class="empty">Loading…</div></main>
</div>
<script>
"use strict";
const SNAPSHOT = /*SNAPSHOT*/null;
const POLL_MS = 5000;
// What the page calls each kind the data names (data.py's group names stay as they are).
const LABELS = { "ag's sections": "Summarized history", "Recent history": "Recent raw history", "Other agents' requests": "Other actors' requests" };
const label = (group) => LABELS[group] || group;
const PREAMBLE = "Harness preamble", NOT_COUNTED = "Not counted by ag";
// the provider's count beyond ag's, shown only when the gap is more than this: smaller is tokenizer noise
const NOT_COUNTED_MIN = 50000;
const uncounted = (n) => n > NOT_COUNTED_MIN ? n : 0;
const GROUP_ORDER = [PREAMBLE, "Recent history", "ag's sections", "Kept from before the cut", "File-change notices", "Other agents' requests", "Stream messages", NOT_COUNTED];
let state = { home: null, selected: null, agent: null, readId: null, context: null, paused: false, timer: null,
  tab: (() => { try { return localStorage.getItem("ag-dashboard-tab") === "gatherer" ? "gatherer" : "actor"; } catch (e) { return "actor"; } })() };

// ------------------------------------------------------------------ helpers
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else if (v !== undefined && v !== null) n.setAttribute(k, v);
  }
  for (const kid of kids) if (kid !== null && kid !== undefined) n.append(kid);
  return n;
};
const svgEl = (tag, attrs = {}) => {
  const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  return n;
};
const compact = (v) => v === null || v === undefined ? "–" : v >= 1e6 ? (v / 1e6).toFixed(v >= 1e7 ? 0 : 1).replace(/\.0$/, "") + "M"
  : v >= 1e3 ? (v / 1e3).toFixed(v >= 1e5 ? 0 : 1).replace(/\.0$/, "") + "K" : String(Math.round(v));
const full = (v) => v === null || v === undefined ? "–" : Math.round(v).toLocaleString();
const axisTime = (t, days, seconds) => new Date(t * 1000).toLocaleString([], days
  ? { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }
  : seconds ? { hour: "2-digit", minute: "2-digit", second: "2-digit" } : { hour: "2-digit", minute: "2-digit" });
const clock = (t, withDate) => t ? new Date(t * 1000).toLocaleString([], withDate
  ? { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" } : { hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "–";
const ago = (t) => {
  if (!t) return "never";
  const s = Math.max(0, Date.now() / 1000 - t);
  return s < 60 ? `${Math.round(s)}s ago` : s < 3600 ? `${Math.round(s / 60)}m ago` : s < 86400 ? `${Math.round(s / 3600)}h ago` : `${Math.round(s / 86400)}d ago`;
};
const span = (a, b) => {
  if (!a || !b) return "–";
  const s = Math.max(0, b - a);
  return s < 60 ? `${s.toFixed(0)}s` : s < 3600 ? `${(s / 60).toFixed(1)}m` : `${(s / 3600).toFixed(1)}h`;
};
// The agent's own events by type, as the context card colors and filters them; fixed order, fixed colors.
const TYPES = [["user_message", "User", "var(--s7)"], ["agent_message", "Assistant", "var(--s1)"],
  ["tool_call", "Tool call", "var(--t-call)"], ["tool_output", "Tool output", "var(--t-output)"],
  ["agent_reasoning", "Reasoning", "var(--s5)"], ["system", "System / developer", "var(--s8)"],
  ["gatherer", "Gatherer messages", "var(--t-gatherer)"]];
// the harness's preamble is filtered like a type, though it is not among the messages
const PREAMBLE_TYPE = ["preamble", PREAMBLE, "var(--s8)"];
const OTHER_TYPE = ["other", "Other", "var(--muted)"];
// ag's own messages placed among the history -- shown in it, where ag put them
const INLINE = new Set(["File-change notices", "Other agents' requests", "Stream messages"]);
// what the Gatherer wrote (its sections, and its messages among the history) is one type; the harness's
// own system/developer messages (its `context` events: instructions, environment notes) another
const GATHERER = new Set(["ag's sections", ...INLINE]);
const OUTSIDE = new Set(["environment_update", "context_stream"]);   // events from outside the conversation
const itemType = (it) => GATHERER.has(it.group) || OUTSIDE.has(it.name) ? typeOf("gatherer")
  : it.name === "context" ? typeOf("system") : typeOf(it.name);
const typeOf = (name) => TYPES.find((t) => t[0] === name) || OTHER_TYPE;
const HISTORY = new Set(["Recent history", "Kept from before the cut"]);
const SHOWN_KEY = "ag-dashboard-shown-types-4";   // -4: system/developer messages and the preamble hidden by default
const shownTypes = (() => {                       // the reader's choice, kept in this browser; by default the
                                                  // conversation: user and assistant messages, and the Gatherer's
  try { const v = JSON.parse(localStorage.getItem(SHOWN_KEY)); if (Array.isArray(v)) return new Set(v); } catch (e) { /* none kept */ }
  return new Set(["user_message", "agent_message", "gatherer"]);
})();
function toggleType(type) {
  if (shownTypes.has(type)) shownTypes.delete(type); else shownTypes.add(type);
  try { localStorage.setItem(SHOWN_KEY, JSON.stringify([...shownTypes])); } catch (e) { /* kept for this page only */ }
  keepingPlace(renderMain);
}
const GROUP_COLORS = { [PREAMBLE]: "var(--s8)", [NOT_COUNTED]: "var(--axis)" };
const color = (group) => GROUP_COLORS[group] || `var(--s${GROUP_ORDER.indexOf(group) || 6})`;
const short = (id) => id && id.length > 18 ? id.slice(0, 8) + "…" + id.slice(-6) : (id || "(none)");
const base = (p) => p ? p.replace(/\/+$/, "").split("/").pop() : "";
const usd = (v) => v === null || v === undefined ? "–" : v > 0 && v < 0.01 ? "<$0.01" : "$" + v.toFixed(2);
const HARNESS = { codex: "Codex", claude: "Claude Code", pi: "Pi", opencode: "OpenCode" };
const harnessName = (h) => HARNESS[h] || "Unknown harness";
const statusOf = (a) => a.building ? ["building", "Building"] : a.running ? ["running", "Running"] : ["idle", "Idle"];
const statusEl = (cls, label) => el("span", { class: "status " + cls }, el("i", { "aria-hidden": "true" }), label);

async function get(path) {
  const r = await fetch(path, { cache: "no-store" });
  if (!r.ok) throw new Error(`${path}: ${r.status}`);
  return r.json();
}
const key = (g, c) => g + "\u0000" + c;

// ------------------------------------------------------------------ data
async function loadHome() {
  state.home = SNAPSHOT ? SNAPSHOT.home : await get("/api/home");
}
async function loadAgent() {
  if (!state.selected) return;
  const [g, c] = state.selected;
  state.agent = SNAPSHOT ? SNAPSHOT.agents[key(g, c)] || null
    : await get(`/api/agent?gatherer=${encodeURIComponent(g)}&channel=${encodeURIComponent(c)}`);
