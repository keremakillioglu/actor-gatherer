# Builds the project site (mkdocs.yml: docs/, rendered with docs_build/theme/) on every pull request,
# as a check, and deploys it to GitHub Pages when a GitHub release is published -- with the PyPI
# package (publish.yml), so the site describes the version people install -- or when run by hand
# (Actions -> Site -> Run workflow). A merge into main does not change the site. The site's source
# is on main; there is no gh-pages branch to edit. Pages is set to deploy from GitHub Actions.

name: Site

on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r docs_build/requirements.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
