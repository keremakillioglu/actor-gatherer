<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ag agent manager</title>
<style>
:root {
  color-scheme: light;
  --page: #f6f6f4; --surface: #fcfcfb; --side: #f4f4f2; --side-rule: var(--ring); --ink: #1d1d1b; --ink-2: #55544f; --muted: #898781;
  --grid: #e4e3dc; --axis: #c3c2b7; --ring: rgba(20,20,18,0.09); --wash: rgba(20,20,18,0.04);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --t-call: #1f8a3b; --t-output: #74c487; --t-gatherer: #e8b600;
  --good: #0ca30c; --warning: #fab219; --critical: #d03b3b; --selected: rgba(42,120,214,0.10);
  /* the Transcript view's terminal: the page's own surface, so the history is part of the page in either theme */
  --term-bg: var(--surface); --term-ink: #2b2a27; --term-dim: #6f6c65; --term-faint: #a09d95; --term-user: #efeee9; --term-ok: #2f9a4c;
  --term-err: #cf3a50; --term-run: #c08a00; --term-accent: #c4643f; --term-code: #f2f1ed; --term-rule: #e2e0d9; --term-bash: #c7307a;
  --term-add: rgba(47,154,76,.12); --term-del: rgba(207,58,80,.10); --term-add-ink: #1b6b34; --term-del-ink: #a5293d; --term-link: #2468c8;
  /* the Files view's markdown, coloured as the NumPy docs (the PyData theme) colour it: links, inline code */
  --md-link: #0a7d91; --md-code: #912583;
  /* code, coloured (the highlighter's hl-* classes, a command's output's a-* colours) */
  --hl-com: #6e6c66; --hl-kw: #7a35b0; --hl-str: #1d7a3a; --hl-num: #a3570a; --hl-fn: #1f5fb4; --hl-prop: #0a7489; --hl-meta: #8a6200;
  --hl-bg: color-mix(in srgb, var(--ink) 4%, var(--surface));
  --scroll: rgba(0,0,0,.16);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #111110; --surface: #1f1f1d; --side: #121211; --side-rule: rgba(255,255,255,0.14); --ink: #ecebe7; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --selected: rgba(57,135,229,0.16);
  --t-call: #2ea043; --t-output: #8fd19e; --t-gatherer: #f2cc3a;
  --term-bg: var(--surface); --term-ink: #e8e6e0; --term-dim: #8f8c84; --term-faint: #66635d; --term-user: #262522; --term-ok: #4eba65;
  --term-err: #ff6b80; --term-run: #e8b600; --term-accent: #d97757; --term-code: #222220; --term-rule: #2e2d2a; --term-bash: #fd5db1;
  --term-add: rgba(78,186,101,.16); --term-del: rgba(255,107,128,.16); --term-add-ink: #b6e8c0; --term-del-ink: #ffc2cb; --term-link: #7cb7ff;
  --md-link: #3fb1c5; --md-code: #f3c7ee;
  --hl-com: #9a978f; --hl-kw: #c7a2ff; --hl-str: #8fd19e; --hl-num: #f0a868; --hl-fn: #82b8ff; --hl-prop: #62c6d6; --hl-meta: #e3bd5f;
  --hl-bg: color-mix(in srgb, var(--ink) 4%, var(--surface));
  --scroll: rgba(255,255,255,.16);
  --buddy-edge: rgba(255,255,255,.28); --buddy-edge2: transparent;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #111110; --surface: #1f1f1d; --side: #121211; --side-rule: rgba(255,255,255,0.14); --ink: #ecebe7; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --selected: rgba(57,135,229,0.16);
  --t-call: #2ea043; --t-output: #8fd19e; --t-gatherer: #f2cc3a;
  --term-bg: var(--surface); --term-ink: #e8e6e0; --term-dim: #8f8c84; --term-faint: #66635d; --term-user: #262522; --term-ok: #4eba65;
  --term-err: #ff6b80; --term-run: #e8b600; --term-accent: #d97757; --term-code: #222220; --term-rule: #2e2d2a; --term-bash: #fd5db1;
  --term-add: rgba(78,186,101,.16); --term-del: rgba(255,107,128,.16); --term-add-ink: #b6e8c0; --term-del-ink: #ffc2cb; --term-link: #7cb7ff;
  --md-link: #3fb1c5; --md-code: #f3c7ee;
  --hl-com: #9a978f; --hl-kw: #c7a2ff; --hl-str: #8fd19e; --hl-num: #f0a868; --hl-fn: #82b8ff; --hl-prop: #62c6d6; --hl-meta: #e3bd5f;
  --hl-bg: color-mix(in srgb, var(--ink) 4%, var(--surface));
  --scroll: rgba(255,255,255,.16);
  --buddy-edge: rgba(255,255,255,.28); --buddy-edge2: transparent;
}
* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--scroll) transparent; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  height: 100vh; display: flex; flex-direction: column; }
/* the page's name, at the top of the left column, as tall as the panes' heads beside it (--top-h: the top row) */
header { display: flex; flex-direction: column; justify-content: center; min-height: var(--top-h, 0px); border-bottom: 1px solid var(--ring); flex: none;
  position: relative; z-index: 30; }   /* above the page (the terminal's own layers reach 11), so its Settings panel is too */
header h1 { font-size: 16px; margin: 0; font-weight: 600; white-space: nowrap; }
/* the page's name, its home, and at the end of the line the settings' button: the page's state at a glance (its dot on
   the icon), and a panel with the dashboard's own details, opened under the column */
header .brand { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 8px 10px 8px 20px; }
header .home { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1 1 0; }
header .about-btn { border: 0; background: none; padding: 5px; border-radius: 6px; font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; flex: none; }
header .about-btn:hover, header .about-btn[aria-expanded="true"] { color: var(--ink); background: var(--wash); }
header .about-btn .gear { position: relative; display: block; }
header .about-btn .gear svg { display: block; }
header .about-btn .gear .state-dot { position: absolute; right: -2px; bottom: -1px; box-shadow: 0 0 0 1.5px var(--side); }
.state-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--axis); display: inline-block; flex: none; }
.state-dot[data-state="live"] { background: var(--good); } .state-dot[data-state="error"] { background: var(--critical); }
.state-dot[data-state="paused"] { background: var(--warning); }
.about { position: absolute; top: calc(100% + 6px); left: 12px; z-index: 5; width: min(400px, calc(100vw - 32px)); max-height: calc(100vh - 90px); overflow: auto; background: var(--surface); border: 1px solid var(--ring);
  border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.12); padding: 12px 14px; font-size: 12px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; overflow-x: hidden; }
.about[hidden] { display: none; }
.about h4 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
.about .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.about .live { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); min-width: 0; overflow-wrap: anywhere; }
/* ag's own settings, at the top of the panel; the file itself in a dialog over the page */
.about h3 { margin: 0; font-size: 12px; font-weight: 600; color: var(--ink); border-bottom: 1px solid var(--ring); padding-bottom: 4px; }
.about .cfg, .about .cfg form, .about .cfg-more { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.about .cfg { gap: 12px; }
.about .cfg label, .about .cfg-label { display: grid; gap: 3px; color: var(--ink-2); }
.about .cfg input, .about .cfg select, .cfg-file textarea { font: inherit; font-size: 12px; color: var(--ink); background: var(--page);
  border: 1px solid var(--ring); border-radius: 6px; padding: 4px 8px; min-width: 0; }
.about .cfg .row input { flex: 1; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.about .cfg-more summary { cursor: pointer; color: var(--muted); font-size: 11px; }
.cfg-checks { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--ink); }
.cfg-checks label { display: inline-flex !important; align-items: center; gap: 4px; }
.cfg-note { color: var(--muted); font-size: 11px; white-space: pre-wrap; overflow-wrap: anywhere; }
.cfg-note.bad { color: var(--warning); } .cfg-note.err { color: var(--critical); }
.cfg-harnesses { display: grid; gap: 2px; font-size: 11px; color: var(--ink-2); }
.cfg-harnesses code, .about code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
.cfg-path { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.cfg-flag { color: var(--warning); }
#cfg-edit { white-space: nowrap; flex: none; }
.cfg-file { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 16px; }
.cfg-file[hidden] { display: none; }
.cfg-file-box { width: min(900px, 100%); height: min(85vh, 900px); background: var(--surface); border: 1px solid var(--ring); border-radius: 10px;
  padding: 12px 14px; display: grid; grid-template-rows: auto 1fr auto; gap: 8px; }
.cfg-file-box .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.cfg-file-box h3 { margin: 0; font-size: 14px; }
.cfg-file textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.45; resize: none; white-space: pre; tab-size: 4; }
.cfg-file .err { color: var(--critical); font-size: 12px; }
.about .servers { padding: 0; white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
/* the selected actor's controls: how its history is shown, and its details */
/* they take the top row right of the actor's name, wrapping there when they need more */
.controls { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; justify-content: flex-end; flex: 0 1 auto; min-width: 0; }
.controls:empty { visibility: hidden; }
.controls .details-btn { display: inline-flex; align-items: center; padding: 5px 7px; }
.controls .details-btn svg { display: block; }
.controls .details-btn[aria-expanded="true"] { background: var(--selected); border-color: transparent; }
button { font: inherit; font-size: 12px; color: var(--ink); background: var(--surface); border: 1px solid var(--ring); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { background: var(--wash); }
/* the page is the screen's height: the agent list and the chat each scroll in their own place */
.layout { display: grid; grid-template-columns: 320px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); flex: 1; min-height: 0; }
/* the left column: the page's name over the list, one rule down its side from the top of the page to the bottom */
.side { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--side-rule); background: var(--side); }
aside { border-right: 1px solid var(--side-rule); background: var(--side); padding: 12px 0; overflow-y: auto; }
#agents { flex: 1; min-height: 0; border-right: 0; }
aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 16px 6px; font-weight: 600; }
.gatherer { padding: 6px 0 8px; border-top: 1px solid var(--grid); }
/* its name, the hide button beside it (on hover), and at the right how many run and the start buttons; a
   click on the row, but on its buttons, opens or closes it */
.gatherer-row { display: flex; align-items: stretch; }
.gatherer-row:hover { background: var(--wash); }
.gatherer-row .name { flex: 0 1 auto; min-width: 0; padding: 6px 4px 6px 12px; display: flex; align-items: center; gap: 8px;
  border: 0; border-radius: 0; background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.gatherer-row .fill { flex: 1 0 auto; display: flex; align-items: center; justify-content: flex-end; padding: 0 4px 0 8px; cursor: pointer; }
.gatherer-row .fill:last-child { padding-right: 16px; }
.gatherer-row .name:focus-visible { outline: 2px solid var(--axis); outline-offset: -2px; }
.gatherer-row .caret { display: inline-block; width: 10px; color: var(--muted); font-size: 10px; transition: transform .15s; }
.gatherer-row .name[aria-expanded="true"] .caret { transform: rotate(90deg); }
.gatherer-row .gname { font-size: 14px; font-weight: 600; letter-spacing: -.005em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.gatherer-row .count { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ink-2);
  background: var(--wash); border-radius: 999px; padding: 1px 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.gatherer-row .count i { width: 6px; height: 6px; border-radius: 50%; background: var(--good); display: inline-block; }
.gatherer-row .count.asking i { background: var(--warning); }
.gatherer-row .count.error i { background: var(--critical); }
.gatherer-row .act { border: 0; border-radius: 6px; background: none; color: var(--muted); padding: 0 8px; margin: 2px 0; line-height: 1;
  display: inline-flex; align-items: center; }
.gatherer-row .act:last-child { margin-right: 8px; }
.gatherer-row .act:hover { color: var(--ink); }
.gatherer-row .act.hide { opacity: 0; }
.gatherer-row:hover .act.hide, .gatherer-row .act.hide:focus-visible { opacity: 1; }
@media (hover: none) { .gatherer-row .act.hide { opacity: 1; } }
.agent-group { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 6px 18px 2px 40px; }
button.agent-group { display: block; width: 100%; text-align: left; background: none; border: 0; cursor: pointer; font-family: inherit; }
button.agent-group:hover { color: var(--ink-2); }
.agent { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; text-align: left; border: 0; border-radius: 8px;
  background: none; padding: 8px 10px; margin: 2px 8px; width: calc(100% - 16px); cursor: pointer; color: var(--ink); }
.agent:hover { background: var(--wash); }
.agent[aria-current="true"] { background: var(--selected); }
/* open in a pane other than the one in focus: the same, fainter */
.agent[data-open="true"] { background: color-mix(in srgb, var(--selected) 45%, transparent); }
.agent[data-open="true"]:hover { background: var(--selected); }
.agent .logo { width: 28px; height: 28px; margin-top: 1px; display: block; }
/* an actor's avatar, its harness's badge small at the corner: the avatar cut away around the badge, so
   whatever is behind the row (hovered, selected) shows between them */
.agent .avatar { position: relative; }
.agent .avatar img { width: 28px; height: 28px; display: block;
  -webkit-mask-image: radial-gradient(circle at 24.5px 24.5px, transparent 8px, #000 8.5px);
  mask-image: radial-gradient(circle at 24.5px 24.5px, transparent 8px, #000 8.5px); }
.agent .avatar .badge { position: absolute; right: -3px; bottom: -3px; width: 13px; height: 13px; display: block; }
.agent .asked { font-size: 13px; line-height: 1.4; font-weight: 500; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  overflow: hidden; overflow-wrap: anywhere; }
/* Claude Code's recap of the session, under what it was last asked: smaller, quieter, newer than the message */
.agent .recap { font-size: 12px; line-height: 1.4; color: var(--ink-2); margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 3;
  -webkit-box-orient: vertical; overflow: hidden; }
.agent .recap .lbl { color: var(--muted); font-size: 10px; letter-spacing: .04em; text-transform: uppercase; margin-right: 5px; }
.agent .asked.none { color: var(--muted); font-weight: 400; font-style: italic; }
/* The session's name (codex's title for its thread), over what it was last asked, which then steps back */
.agent .name { font-size: 13px; line-height: 1.4; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; }
.agent .name + .asked { font-size: 12px; font-weight: 400; color: var(--ink-2); -webkit-line-clamp: 2; }
.agent .meta { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.agent .meta .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--axis); flex: none; }
.agent .meta .dot.building { background: var(--warning); } .agent .meta .dot.failed { background: var(--critical); }
.agent .meta .dot.finished { background: var(--s1); }
/* its turn under way: the glyph turns, as Claude Code's does while it works */
.agent .meta .dot.running { width: 9px; height: auto; border-radius: 0; background: none; color: var(--good); font-size: 12px; line-height: 1; text-align: center; }
.agent .meta .dot.running::before { content: "✻"; animation: term-spin 1.2s steps(1) infinite; animation-delay: var(--spin-at, 0s); }
/* its turn waits on the user: a question asked, a plan to approve, in its terminal */
.agent .meta .dot.asking, .status.asking i { background: var(--warning); box-shadow: 0 0 0 2px color-mix(in srgb, var(--warning) 35%, transparent); }
/* its turn stopped on an error: its call to the model failed, and it gave up */
.agent .meta .dot.error, .status.error i { background: var(--critical); box-shadow: 0 0 0 2px color-mix(in srgb, var(--critical) 30%, transparent); }
/* its turn over, but something it started still runs: Running's colour, holding still */
.agent .meta .dot.background, .status.background i { background: var(--good); }
/* what it runs in the background, under its facts: how many, and what they are for */
.agent .bgline { font-size: 12px; color: var(--ink-2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agent .meta .dot.closed { background: none; box-shadow: inset 0 0 0 1.5px var(--axis); }
.hidden-list { border-top: 1px solid var(--grid); padding: 8px 0 4px; }
.hidden-list > summary { margin: 0; padding: 4px 16px; font-size: 12px; color: var(--muted); list-style: none; }
.hidden-list > summary::-webkit-details-marker { display: none; }
.hidden-list > summary:hover { color: var(--ink-2); }
.hidden-row { display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 34px; font-size: 13px; }
.hidden-row .gname { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.hidden-row .why { color: var(--muted); font-size: 12px; white-space: nowrap; }
.hidden-row button { margin-left: auto; }
.status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.status i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--axis); }
.status.running i { background: var(--good); }
.status.building i { background: var(--warning); }
.status.finished i { background: var(--s1); }
.status.failed i { background: var(--critical); }
.status.closed i { background: none; box-shadow: inset 0 0 0 1.5px var(--axis); }
.servers { color: var(--ink-2); font-size: 12px; }
main { padding: 0; min-width: 0; min-height: 0; display: flex; position: relative; overflow: hidden; }
/* Panes: the actors open side by side (Ctrl/Cmd+click in the list), each with its head -- the actor, its
   controls, a close -- the one in focus a shade darker; dividers between them to drag. The first is this
   page's own view; the others are the page again in a frame, each its own actor's (PANE) */
.panes { display: flex; min-width: 0; min-height: 0; position: relative; }
.pane-note { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 10; max-width: calc(100% - 32px);
  background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 6px 12px; font-size: 12px; color: var(--ink-2);
  box-shadow: 0 4px 16px rgba(0,0,0,.12); }
.panes.resizing { cursor: col-resize; user-select: none; }
.panes.resizing iframe { pointer-events: none; }
.pane { flex: 1 1 0; min-width: 0; min-height: 0; display: flex; flex-direction: column; container: pane / inline-size; }
.pane > main { flex: 1 1 auto; }
.pane > iframe { flex: 1 1 auto; display: block; width: 100%; min-height: 0; border: 0; background: var(--surface); }
.pane-gutter { flex: none; width: 5px; margin: 0 -2px; position: relative; z-index: 4; cursor: col-resize; touch-action: none; }
.pane-gutter::after { content: ""; position: absolute; inset: 0 2px; background: var(--ring); }
.pane-gutter:hover::after, .panes.resizing .pane-gutter::after { inset: 0 1px; background: var(--axis); }
/* A pane's top: its head, in the page's top row, as tall as the row (--top-h: the tallest of the page's name and
   the heads), so the rule under the row runs straight across. Alone, the head is one line: the actor's controls,
   at the right, as a header's; split, each pane's says whose it is and has its ×: who, the view's switch and Details,
   the ×, and the view's own tools (filters, switches) on a line under them -- a narrow pane's, who and the × on a
   line, the switch and Details under them, then the tools */
.pane-top { flex: none; display: flex; flex-direction: column; justify-content: center; min-height: var(--top-h, 0px); background: var(--surface);
  border-bottom: 1px solid var(--ring); }

.files .md h1 { font-size: 1.35em; } .files .md h2 { font-size: 1.2em; } .files .md h3 { font-size: 1.07em; } .files .md h4, .files .md h5, .files .md h6 { font-size: 1em; }
.files .md > h1:first-child, .files .md > h2:first-child, .files .md > h3:first-child { line-height: var(--lh); }   /* beside the reply's dot */
.files .md strong { color: var(--ink); font-weight: 650; }
.files .md a { color: var(--md-link); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--md-link) 40%, transparent); text-underline-offset: 2px; }
.files .md a:hover { text-decoration-color: currentColor; }
.files .md ul, .files .md ol { padding-left: 22px; }
.files .md li { margin: 3px 0; } .files .md li > ul, .files .md li > ol { margin: 3px 0 0; }
.files .md li::marker { color: var(--muted); }
.files .md li:has(> input[type="checkbox"]) { list-style: none; margin-left: -20px; }
.files .md li > input[type="checkbox"] { margin: 0 6px 0 0; vertical-align: -2px; accent-color: var(--md-link); }
.files .md code { font: .88em var(--mono); color: var(--md-code); background: color-mix(in srgb, var(--ink) 6%, transparent);
  border: 1px solid var(--ring); padding: 0 4px; border-radius: 4px; overflow-wrap: anywhere; }
.files .md pre { background: color-mix(in srgb, var(--ink) 5%, var(--surface)); border: 1px solid var(--ring);
  border-radius: 4px; padding: 9px 12px; overflow-x: auto; max-width: 100%; white-space: pre; }
.files .md pre code { font: 12.5px/1.55 var(--mono); color: var(--ink); background: none; border: 0; padding: 0; border-radius: 0; overflow-wrap: normal; }
.files .md blockquote { padding: 7px 12px; border-left: 4px solid var(--muted); border-radius: 4px;
  background: color-mix(in srgb, var(--ink) 5%, var(--surface)); color: var(--ink-2); }
.files .md hr { border: 0; border-top: 1px solid var(--axis); margin: 16px 0; }
.files .md table { display: block; width: max-content; max-width: 100%; overflow-x: auto; border-collapse: collapse; font-size: .93em; line-height: 1.45; }
.files .md th, .files .md td { border: 0; border-bottom: 1px solid var(--ring); padding: 5px 12px; text-align: left; vertical-align: top; white-space: normal; }
.files .md th + th, .files .md td + td { border-left: 1px solid var(--ring); }
.files .md thead tr { background: color-mix(in srgb, var(--ink) 5%, var(--surface)); }
.files .md th { color: var(--ink); font-weight: 650; border-bottom: 2px solid var(--md-link); }
.files .md tbody tr:nth-child(even) { background: var(--wash); }
.files .md th[align="right"], .files .md td[align="right"] { text-align: right; font-variant-numeric: tabular-nums; }
.files .md th[align="center"], .files .md td[align="center"] { text-align: center; }
.files .md img { max-width: 100%; }
.files .fl-none { margin: 4px 0 0 2px; color: var(--muted); font-style: italic; }
/* a run of thinking: a message as the others are, "Thought:" before it, dim and in italics; opened, its words under the word */
.files .fl-reply.thought > summary .lbl { flex: none; color: var(--muted); font-style: italic; }
.files .fl-reply.thought > .md { margin-top: 0; }
/* the turn's latest call, while nothing was said or thought after it: a message as the others, its dot how it went; opened, its call and output */
.files .fl-reply.call > summary .dot.ok { color: var(--good); } .files .fl-reply.call > summary .dot.err { color: var(--critical); }
.files .fl-reply.call > summary .dot.run { color: var(--warning); animation: term-blink 1s steps(2) infinite; }
.files .fl-reply.call > summary .dot.wait { color: var(--warning); } .files .fl-reply.call > summary .dot.stop { color: var(--muted); }
.files .fl-reply.call > summary .lbl { flex: none; color: var(--muted); }
.files .fl-reply.call > summary .lbl.err { color: var(--critical); }
.files .fl-reply.call[open] > summary .first { display: block; }
/* Claude Code's notes among the messages (notedReply): a line, what it is in grey; opened, the rest under it */
.files .fl-reply.noted > summary .lbl { flex: none; color: var(--muted); }
.files .fl-reply.noted[open] > summary .first { display: block; }
.files .fl-reply.noted > .md, .files .fl-reply.noted > .fl-none { margin: 4px 0 6px 15px; }
.files .fl-status { display: flex; align-items: center; gap: 6px; margin: 6px 0 0 2px; color: var(--term-accent); font-size: .93em; }
.files .fl-status .spin { flex: none; }
.files .fl-status .tx { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* the actor at work, "Simple" (buddy()): its avatar's character out of its circle, small, moving as it would -- its
   data-motion, a move and an effect (avatars/README.md); and on the stage, while it thinks, the same effect laid over the
   character (.stage-box). Every animation runs on the page's clock (--t), so a redraw does not restart it. */
.buddy { position: relative; display: inline-block; width: 24px; height: 24px; flex: none; isolation: isolate; pointer-events: none; --t: 0s; }
/* a soft edge round it, so a white character stands out on a light page (--buddy-edge: the theme's) */
.buddy img { width: 100%; height: 100%; display: block; transform-origin: var(--o, 50% 50%);
  filter: drop-shadow(0 0 .7px var(--buddy-edge, rgba(0, 0, 0, .45))) drop-shadow(0 1px 1px var(--buddy-edge2, rgba(0, 0, 0, .12)));
  animation: var(--m, b-bob) var(--d, 2.4s) var(--e, ease-in-out) infinite var(--t); }
.buddy i { position: absolute; pointer-events: none; opacity: 0; font-style: normal; line-height: 1;
  animation: var(--f, none) var(--fd, 2.4s) var(--fe, ease-out) infinite; }
.buddy i:nth-of-type(1) { --k: 0; animation-delay: var(--t); }
.buddy i:nth-of-type(2) { --k: 1; animation-delay: calc(var(--t) - var(--fd, 2.4s) / 3); }
.buddy i:nth-of-type(3) { --k: 2; animation-delay: calc(var(--t) - var(--fd, 2.4s) * 2 / 3); }
.buddy.still img, .buddy.still i, .buddy.still::before { animation: none; }
.buddy.still { opacity: .55; filter: grayscale(.6); }
@media (prefers-reduced-motion: reduce) { .buddy img, .buddy i, .buddy::before { animation: none !important; } }

/* moves: the character (small, .buddy; or on its stage as it thinks, .me), about its middle, its foot (50% 100%) or the string it
   hangs from (50% 0) */
.m-bob { --m: b-bob; --d: 2.4s; }
@keyframes b-bob { 50% { transform: translateY(-2px); } }
.m-float { --m: b-float; --d: 3.6s; }
@keyframes b-float { 25% { transform: translateY(-1.5px) rotate(-3deg); } 75% { transform: translateY(.5px) rotate(3deg); } }
.m-hop { --m: b-hop; --d: 2.2s; --e: ease-out; --o: 50% 100%; }
@keyframes b-hop { 0%, 55%, 100% { transform: none; } 8% { transform: scale(1.08, .9); } 24% { transform: translateY(-5px) scale(.96, 1.05); }
  42% { transform: translateY(0) scale(1.07, .93); } }
.m-swim { --m: b-swim; --d: 3s; }
@keyframes b-swim { 0%, 100% { transform: translateX(-1.5px) rotate(4deg); } 50% { transform: translate(1.5px, -.5px) rotate(-4deg); } }
.m-glide { --m: b-glide; --d: 5s; }
@keyframes b-glide { 0%, 100% { transform: translateX(-2.5px) rotate(1deg); } 50% { transform: translateX(2.5px) rotate(-1deg); } }
.m-pulse { --m: b-pulse; --d: 2.6s; --o: 50% 100%; }
@keyframes b-pulse { 0%, 100% { transform: none; } 25% { transform: scale(1.08, .88); } 50% { transform: translateY(-3px) scale(.95, 1.06); }
  75% { transform: translateY(-1px); } }
.m-puff { --m: b-puff; --d: 3.2s; }
@keyframes b-puff { 0%, 30%, 100% { transform: none; } 45% { transform: scale(1.15); } 70% { transform: scale(1.13); } 85% { transform: scale(.98); } }
.m-waddle { --m: b-waddle; --d: 1.3s; --e: linear; --o: 50% 100%; }
@keyframes b-waddle { 0%, 100% { transform: rotate(-6deg); } 25% { transform: translateY(-1px); } 50% { transform: rotate(6deg); } 75% { transform: translateY(-1px); } }
.m-wobble { --m: b-wobble; --d: 3s; --o: 50% 100%; }
@keyframes b-wobble { 0%, 70%, 100% { transform: none; } 10% { transform: rotate(-11deg); } 25% { transform: rotate(8deg); } 40% { transform: rotate(-5deg); }
  55% { transform: rotate(2deg); } }
.m-swing { --m: b-swing; --d: 3s; --o: 50% 0; }
@keyframes b-swing { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
.m-sway { --m: b-sway; --d: 4s; --o: 50% 100%; }
@keyframes b-sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
.m-nod { --m: b-nod; --d: 2.8s; --o: 50% 100%; }
@keyframes b-nod { 0%, 60%, 100% { transform: none; } 70% { transform: translateY(1px) rotate(7deg); } 80% { transform: none; } 88% { transform: translateY(.5px) rotate(5deg); } }
.m-peck { --m: b-peck; --d: 2.2s; --o: 50% 100%; }
@keyframes b-peck { 0%, 50%, 100% { transform: none; } 10%, 30% { transform: rotate(-13deg); } 20%, 40% { transform: none; } }
.m-roll { --m: b-roll; --d: 3.6s; }
@keyframes b-roll { 0%, 100% { transform: translateX(-3px) rotate(-17deg); } 50% { transform: translateX(3px) rotate(17deg); } }
.m-fan { --m: b-fan; --d: 1.2s; --o: 50% 90%; }
@keyframes b-fan { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(10deg); } }
.m-beckon { --m: b-beckon; --d: 2.6s; --o: 50% 100%; }
@keyframes b-beckon { 0%, 45%, 100% { transform: none; } 10%, 30% { transform: translateY(-1px) rotate(-7deg); } 20% { transform: none; } }
.m-squish { --m: b-squish; --d: 2.4s; --o: 50% 100%; }
@keyframes b-squish { 0%, 100% { transform: none; } 30% { transform: scale(1.09, .91); } 60% { transform: scale(.96, 1.05); } 80% { transform: scale(1.02, .98); } }
.m-crawl { --m: b-crawl; --d: 6s; }
@keyframes b-crawl { 0%, 100% { transform: translateX(-2.5px); } 25%, 75% { transform: translateY(-.5px); } 50% { transform: translateX(2.5px); } }
.m-wag { --m: b-wag; --d: 2s; }
@keyframes b-wag { 0%, 50%, 100% { transform: none; } 10%, 30% { transform: rotate(6deg); } 20% { transform: rotate(-6deg); } 40% { transform: rotate(-3deg); } }
.m-patter { --m: b-patter; --d: 1.8s; --o: 50% 100%; }
@keyframes b-patter { 0%, 45%, 100% { transform: none; } 8%, 24% { transform: translateY(-1.5px) scale(1.02, .98); } 16%, 32% { transform: none; } }
.m-flutter { --m: b-flutter; --d: 2.6s; }
@keyframes b-flutter { 0%, 100% { transform: none; } 6% { transform: translateY(-2px); } 12% { transform: translateY(-1px); } 18% { transform: translateY(-3px); }
  24% { transform: translateY(-2px); } 30% { transform: translateY(-3.5px); } 55% { transform: translateY(-2.5px) rotate(-3deg); } 80% { transform: none; } }
.m-lookabout { --m: b-lookabout; --d: 4.4s; --o: 50% 100%; }
@keyframes b-lookabout { 0%, 100% { transform: none; } 15%, 75% { transform: translateY(-1.5px); } 30% { transform: translateY(-1.5px) rotate(-8deg); }
  55% { transform: translateY(-1.5px) rotate(8deg); } 90% { transform: none; } }
.m-flip { --m: b-flip; --d: 4s; }
@keyframes b-flip { 0%, 72% { transform: none; } 84% { transform: translateY(-4px) rotateY(180deg); } 96%, 100% { transform: rotateY(360deg); } }
.m-whisk { --m: b-whisk; --d: 2s; --e: linear; }
@keyframes b-whisk { 0%, 50%, 100% { transform: none; } 6%, 18%, 30%, 42% { transform: translateX(-1px); } 12%, 24%, 36% { transform: translateX(1px); } }
.m-wiggle { --m: b-wiggle; --d: 1.6s; }
@keyframes b-wiggle { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
.m-spin { --m: b-spin; --d: 10s; --e: linear; }
@keyframes b-spin { 100% { transform: rotate(360deg); } }

/* effects: three of each, a third of the way apart (or, a spout, together), around the avatar */
.buddy.f-steam { --f: b-steam; --fd: 2.4s; }
.buddy.f-steam i { top: -3px; left: calc(30% + var(--k) * 20%); width: 2px; height: 6px; border-radius: 2px; background: var(--muted); }
@keyframes b-steam { 0% { opacity: 0; transform: translateY(2px); } 30% { opacity: .55; } 60% { transform: translate(1.5px, -5px); }
  100% { opacity: 0; transform: translate(-.5px, -10px) scaleY(1.4); } }
.buddy.f-bubbles { --f: b-bubbles; --fd: 2.6s; }
.buddy.f-bubbles i { top: 15%; left: calc(15% + var(--k) * 30%); width: 4px; height: 4px; border: 1px solid #5fb0e6; border-radius: 50%; }
@keyframes b-bubbles { 0% { opacity: 0; transform: scale(.4); } 20% { opacity: .85; } 100% { opacity: 0; transform: translate(1px, -13px) scale(1); } }
.buddy.f-spout { --f: b-spout; --fd: 3.6s; }
.buddy.f-spout i { top: 0; left: 45%; width: 2.5px; height: 2.5px; border-radius: 50%; background: #5fb0e6; --x: calc((var(--k) - 1) * 4px);
  animation-delay: var(--t); }
@keyframes b-spout { 0%, 60% { opacity: 0; transform: none; } 66% { opacity: .9; } 80% { transform: translate(calc(var(--x) * .6), -8px); }
  100% { opacity: 0; transform: translate(var(--x), -3px); } }
.buddy.f-petals { --f: b-petals; --fd: 3.6s; --fe: linear; }
.buddy.f-petals i { top: -6px; left: calc(var(--k) * 35%); width: 4px; height: 3px; border-radius: 3px 0; background: #f6a5c8; }
@keyframes b-petals { 0% { opacity: 0; transform: none; } 15% { opacity: .9; } 50% { transform: translate(4px, 12px) rotate(120deg); }
  100% { opacity: 0; transform: translate(1px, 25px) rotate(260deg); } }
.buddy.f-snow { --f: b-snow; --fd: 3.4s; --fe: linear; }
.buddy.f-snow i { top: -5px; left: calc(5% + var(--k) * 40%); width: 2.5px; height: 2.5px; border-radius: 50%; background: #9cc3ef; }
@keyframes b-snow { 0% { opacity: 0; transform: none; } 15% { opacity: .95; } 50% { transform: translate(2px, 12px); } 100% { opacity: 0; transform: translate(-1px, 26px); } }
.buddy.f-sparkle { --f: b-sparkle; --fd: 2.7s; --fe: ease-in-out; }
.buddy.f-sparkle i { font-size: 7px; color: #f2b01e; }
.buddy.f-sparkle i::before { content: "✦"; }
.buddy.f-sparkle i:nth-of-type(1) { top: -4px; left: -4px; } .buddy.f-sparkle i:nth-of-type(2) { top: -5px; right: -4px; }
.buddy.f-sparkle i:nth-of-type(3) { bottom: 1px; right: -6px; }
@keyframes b-sparkle { 0%, 60%, 100% { opacity: 0; transform: scale(.3); } 30% { opacity: 1; transform: scale(1) rotate(45deg); } }
.buddy.f-notes { --f: b-notes; --fd: 3.3s; }
.buddy.f-notes i { top: -2px; left: 62%; font-size: 8px; color: var(--muted); }
.buddy.f-notes i::before { content: "♪"; } .buddy.f-notes i:nth-of-type(2)::before { content: "♫"; }
@keyframes b-notes { 0% { opacity: 0; transform: none; } 20% { opacity: .85; } 100% { opacity: 0; transform: translate(6px, -10px) rotate(15deg); } }
.buddy.f-breeze { --f: b-breeze; --fd: 1.8s; }
.buddy.f-breeze i { right: 100%; top: calc(28% + var(--k) * 20%); width: 6px; height: 1.2px; border-radius: 1px; background: var(--muted); transform-origin: right; }
@keyframes b-breeze { 0% { opacity: 0; transform: scaleX(.3); } 30% { opacity: .7; } 100% { opacity: 0; transform: translateX(-6px) scaleX(1); } }
.buddy.f-ripple { --f: b-ripple; --fd: 3s; }
.buddy.f-ripple i { left: 50%; bottom: -3px; width: 20px; height: 5px; margin-left: -10px; border: 1px solid #6aaee0; border-radius: 50%; }
@keyframes b-ripple { 0% { opacity: .75; transform: scale(.35); } 100% { opacity: 0; transform: scale(1.35); } }
.buddy.f-glow::before { content: ""; position: absolute; inset: -5px; z-index: -1; border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 166, 64, .6), transparent 68%); animation: b-glow 2.8s ease-in-out infinite var(--t); }
@keyframes b-glow { 0%, 100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.08); } }

/* The actor at work in the Chat view (atWork): its avatar's character out of its circle, acting out what its turn is doing
   (s-<kind>, work.py's) with the same tool whatever the character, so a tool always means the same thing; reacting to how a
   call ended, once (r-*); between calls, thinking, moving as its character does (its avatar_motion's move: .me.m-<move>).
   Its loops run on the page's clock (--t; its action's, --a, slowing to a stop as a call ends), a reaction from when it
   began (--r), so a redraw restarts neither. */
/* what it is doing in words, at the end of the latest turn; the actor at work under it, in line with its words */
.files .fl-working { margin: 6px 0 0 2px; font-size: .93em; min-width: 0; }
.files .fl-working > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.files .fl-working .now { color: var(--term-accent); }
/* when it last did something, and how long the turn has run: counting, dim, above the words */
.files .fl-working .fl-times { color: var(--muted); font-size: .86em; opacity: .8; font-variant-numeric: tabular-nums; }
.files .fl-talk > .fl-status { margin: 4px 6px 0 8px; }
.files .fl-status svg.stage { height: 60px; margin: 0 0 0 -4px; }
.files .fl-status .spin { font-size: 1.4em; }
.files .fl-status > .buddy { margin: 2px 0 0 4px; }
/* the turn over: the actor small, done -- a check at its corner, still; grown in if the page saw it end (--r) */
.files .fl-done { display: flex; align-items: center; margin: 6px 6px 0 17px; }
.files .fl-done .done { position: relative; display: inline-flex; flex: none; transform-origin: 30% 90%;
  animation: w-arrive .5s cubic-bezier(.3, 1.3, .5, 1) var(--r, -60s) 1 both; }
.files .fl-done .done img { width: 24px; height: 24px; display: block; filter: drop-shadow(0 0 .6px var(--buddy-edge, rgba(0, 0, 0, .45))); }
.files .fl-done .done .ok { position: absolute; right: -4px; bottom: -2px; width: 12px; height: 12px; border-radius: 50%; background: #22a55a;
  box-shadow: 0 0 0 1.5px var(--surface); display: grid; place-items: center; }
.files .fl-done .done .ok svg { width: 8px; height: 8px; }
svg.stage { height: 32px; width: auto; flex: none; overflow: visible; --t: 0s; --a: 0s; --r: -60s; --x: -60s; --y: -60s; --z: -60s; --p: -60s;
  --b: -60s; --dot: #f97316; --metal: light-dark(#94a3b8, #8a94a3); }
.stage .me, .stage .prop, .stage .tb, .stage .bd, .stage .cf, .stage .o-bang, .stage .mag, .stage .gear, .stage .parcel, .stage .flip,
.stage .hg, .stage .st, .stage .sb, .stage .mini { transform-box: fill-box; }
/* a soft edge round it, so a white character stands out on a light page (--buddy-edge: the theme's) */
.stage image { filter: drop-shadow(0 0 .7px var(--buddy-edge, rgba(0, 0, 0, .45))) drop-shadow(0 1px 1px var(--buddy-edge2, rgba(0, 0, 0, .12))); }
.stage .ov { display: none; }
.stage .me { transform-origin: 50% 100%; }
/* from one action to the next (--x: since the change): the old tool fades out as the new one grows in; a new turn's actor
   grows in (--z) */
.stage .enter, .stage .leave { transform-box: fill-box; transform-origin: 50% 80%; }
.stage .enter { animation: w-in .5s ease-out var(--x) 1 both; }
.stage .leave { animation: w-out .4s ease-in var(--x) 1 both; }
@keyframes w-in { from { opacity: 0; transform: scale(.88); } to { opacity: 1; transform: none; } }
@keyframes w-out { from { opacity: 1; transform: none; } to { opacity: 0; transform: scale(.92); } }
svg.stage.arriving { transform-origin: 30% 90%; animation: w-arrive .55s cubic-bezier(.3, 1.3, .5, 1) var(--z) 1 both; }
@keyframes w-arrive { from { opacity: 0; transform: translateY(4px) scale(.6); } to { opacity: 1; transform: none; } }
/* thinking (no call running): moving as its character does, slower; a thought by its head -- two puffs, then a cloud, grown in
   from --b, its dots hopping in the avatar's colour (--dot); popped away (--y) as a call begins */
.stage.s-think .me { transform-origin: var(--o, 50% 50%); animation: var(--m, b-bob) calc(var(--d, 2.4s) * 1.4) var(--e, ease-in-out) var(--t) infinite; }
.stage .o-think { display: none; }
.stage.musing .o-think, .stage.popping .o-think { display: inline; }
.stage.r-fail .o-think, .stage.r-pass .o-think, .stage.r-tfail .o-think, .stage.r-ship .o-think, .stage.streak .o-think, .stage.retry .o-think { display: none; }
.stage .tb { transform-origin: 50% 50%; animation: w-bub .4s cubic-bezier(.3, 1.6, .5, 1) var(--b) 1 both; }
.stage .tb2 { animation-delay: calc(var(--b) + .12s); }
.stage .tb3 { transform-origin: 15% 85%; animation-delay: calc(var(--b) + .24s); }
@keyframes w-bub { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: none; } }
.stage .te { fill: light-dark(#ddd7cf, #7a746c); stroke: light-dark(#ddd7cf, #7a746c); stroke-width: 1.8; }
.stage .tf, .stage .tb1, .stage .tb2 { fill: light-dark(#fff, #fbf8f3); }
.stage .tb1, .stage .tb2 { stroke: light-dark(#ddd7cf, #7a746c); stroke-width: .9; }
.stage .td circle { fill: var(--dot); transform-box: fill-box; animation: w-dothop 1.2s ease-in-out var(--t) infinite; }
.stage .td circle:nth-child(2) { animation-delay: calc(var(--t) + .16s); }

// The server's stream for the selected agent: `home` and `agent` at once, then each time one changes
// (the server is woken by ag's notifications). EventSource reconnects by itself, and a new stream
// starts with both again, so nothing is missed while it was down. Reopened when the selection
// changes; closed while paused. A message for an agent no longer selected is dropped.
// The other panes' actors come on it too (`also`, each an `actor`), handed to their frames: a browser keeps
// only six connections to a server open, and a stream holds one for as long as it is open. A frame has no
// stream of its own: the page around it streams for it.
function connect() {
  if (PANE) { state.stream = PANE.stream; paneUrl(); PANE.shows(window, state.selected); return; }
  if (state.stream) { state.stream.close(); state.stream = null; }
  if (SNAPSHOT || state.paused) return;
  const sel = state.selected;
  const q = [...(sel ? [`gatherer=${encodeURIComponent(sel[0])}`, `channel=${encodeURIComponent(sel[1])}`] : []),
    ...(panes.others.length ? [`also=${encodeURIComponent(JSON.stringify(panes.others.map((p) => [p.g, p.c])))}`] : [])];
  const es = new EventSource("/api/stream" + (q.length ? "?" + q.join("&") : ""));
  state.stream = es;
  panes.actors.clear();
  const mine = () => state.stream === es;
  es.addEventListener("home", (ev) => { if (mine()) { panesTake("home", ev.data); streamTake("home", ev.data, mine); } });
  es.addEventListener("agent", (ev) => { if (mine()) streamTake("agent", ev.data, mine, sel); });
  es.addEventListener("actor", (ev) => { if (mine()) panesTake("actor", ev.data); });
  es.addEventListener("open", () => { if (mine()) render(); });
  es.addEventListener("error", () => { if (mine() && !state.paused) setLive("Reconnecting…"); });

// What the stream says, one message at a time, in order: the home, and the agent of `sel` -- or, in a frame,
// the `actor` its page around it hands it (the stream's, for this pane's actor). In a frame, after its first load.

function streamTake(name, data, mine = () => true, sel = null) {
  streamQueue = streamQueue.then(async () => {
    if (!mine() || state.paused) return;
    try {
      const got = JSON.parse(data);
      if (name === "home") {
        takeHome(got);
        await loadChat();                            // a session's state: its messages may have moved on too
        if (!state.selected && !PANE) {              // the first agent to appear: shown, and watched
          const first = got.gatherers.find((g) => g.agents.length);
          if (first) { state.selected = [first.name, firstAgent(first).channel]; await loadAgent(); render(true); connect(); }
        }
      } else {
        const [g, c, agent] = name === "actor" ? [got.gatherer, got.channel, got.agent] : [...(sel || []), got];
        if (!isAt(state.selected, g, c)) return;     // for an actor no longer shown
        await takeAgent(agent); await loadChat();
      }
      render();
    } catch (err) { setLive(`Not updated: ${err.message}`); }
  });
}

// ------------------------------------------------------------------ finished, not yet looked at
// When the reader last looked at each actor: its `last` (data.py: its latest activity, in the server's
// clock) at that moment. An actor that has stopped with activity after that is FINISHED: done, and not yet
// seen. Looking means having it open in a pane while the page is visible. Kept by the server (seen.py,
// `home.seen`: {gatherer: {channel: last}}) so every dashboard on this home shows the same: at either address
// (localhost, 127.0.0.1 -- each a browser storage of its own), in any browser, after a restart. The page's
// copy takes the larger of the server's and its own looks, so a home read before a look was kept does not
// undo it. Before any dashboard on the home kept a look (`home.seen` null), every actor there is taken as
// seen -- as of this browser's own look, where it kept one before -- and handed to the server. A server from
// before `seen` (none in its home): kept in this browser, as it was.

    seen.handing = true;
    tellSeen(all).then((kept) => { if (kept) dropHere(); else seen.handing = false; });

  if (state.selected) {                              // a codex session renamed to its thread: followed there
    const g = home.gatherers.find((x) => x.name === state.selected[0]);

    const a = g && g.agents.find((x) => x.channel === c);

const COLLAPSED_KEY = "ag-dashboard-collapsed-gatherers";

    sv ? signature([sv.target, sv.plan && sv.plan.version, sv.err, sv.done, sv.target === "dir" ? "" : hist.claudeDir]) : ""].join("|");
  return histRecs.get(r.id, sig, () => {
    const [, name, file] = HIST_KINDS[r.kind] || ["", r.kind, "extract.md"];
    const body = el("div", { class: "body" });
    if (running) body.append(el("div", { class: "working" }, el("span", { class: "spin", "aria-hidden": "true" }),
      `Asking ${r.model || "the Gatherer's model"}…`, el("span", { class: "ticking", "data-since": r.created, text: span(r.created, now) })));
    else if (r.status === "failed") body.append(el("div", { class: "fail", text: r.error || "The call failed." }));
    else body.append(...recContent(r));
    const done = r.status === "done";
    const savable = done && r.kind !== "summary" && !(r.kind === "memory" && !(r.memories || []).length);
    const acts = el("div", { class: "acts" },
      savable ? el("button", { type: "button", class: sv ? "" : "primary", title: "Write it where Claude Code reads it — you see each file first",
        onclick: () => {
          if (sv) { hist.saving = null; } else {
            const info = selectedInfo() || {};
            hist.saving = { id: r.id, target: "dir", dir: (r.dirs || [])[0] || info.cwd || "", plan: null, err: "", done: null };
            setTimeout(() => recPlan(r));
          }
          hist.version++; histRedraw();
        } }, "Save to…") : null,
      done ? copyButton(recText(r)) : null,
      done ? el("button", { type: "button", title: `Save it as ${file}`, onclick: () => saveFile(file, recText(r)) }, "Download") : null,
      el("button", { type: "button", title: "Select the history it was made from again", onclick: () => {
        const sel = new Map();
        for (const [a, b] of r.rows) for (let x = a; x <= b; x++) { const e = hist.byId.get(`m:${x}`); sel.set(x, e ? [e.channel, e.tokens] : [r.channels[0], 0]); }
        hist.ask = r.ask || ""; const box = document.getElementById("hist-ask"); if (box) box.value = hist.ask;
        histSelect(sel);
      } }, "Select again"),
      r.status === "failed" ? el("button", { type: "button", onclick: () => histMake(r.kind, r) }, "Try again") : null,
      el("button", { type: "button", title: running ? "Stop it, and remove it" : "Remove it", onclick: () => histDelete(r) }, running ? "Stop" : "Delete"));
    const what = [plural(r.messages, "message"), plural(r.turns, "turn"), r.channels.length > 1 ? `${r.channels.length} actors` : null,
      r.model && !running ? r.model : null].filter(Boolean).join(" · ");
    return el("details", { class: "h-rec", id: `rec-${r.id}`, ...(r.id === hist.recOpen ? { open: "" } : {}) },
      el("summary", {},
        el("div", { class: "top" }, el("span", { class: `chip-k ${r.kind}`, text: name }),
          running ? statusEl("building", "Working") : r.status === "failed" ? statusEl("failed", "Failed") : null,
          el("span", { class: "when", text: clock(r.created, true) })),
        el("div", { class: "what", text: what }),
        r.ask ? el("div", { class: "ask", text: `“${r.ask}”` }) : null),
      body, acts, recSave(r),
      ...(r.saved || []).map((x) => el("div", { class: "saved" }, el("b", { text: "Saved " }), `${clock(x.at, true)} · ${x.paths.join(", ")}`)));
  });
}
// The panel at the right: its room kept empty until something is selected, then what can be done with it, and the
// HIST_RECENT artifacts the Gatherer made last (the rest a click away). It stays while a result it asked for shows,
// until closed.
const HIST_RECENT = 3;
function histSide(h) {
  const list = hist.recs.gatherer === h.gatherer ? hist.recs.list.filter((r) => (r.channels || []).includes(h.channel)) : [];   // this actor's
  histRecs.begin(h.gatherer);
  if (!hist.panel) return el("div", { class: "h-side closed", "aria-hidden": "true" });
  const side = el("div", { class: "h-side open", "data-keep": "hist-side", "data-morph": "", role: "complementary", "aria-label": "Selected history" });
  const shown = hist.allRecs ? list : list.slice(0, HIST_RECENT);
  side.kids = [histActions(), ...(list.length ? [el("div", { class: "h-side-h", text: "Recent artifacts" })] : []), ...shown.map(recCard),
    list.length > HIST_RECENT ? el("button", { type: "button", class: "h-older", onclick: () => { hist.allRecs = !hist.allRecs; hist.version++; histRedraw(); } },
      hist.allRecs ? "Show only the recent" : `Show ${list.length - HIST_RECENT} older`) : null].filter(Boolean);
  return side;
}
function histRender() {
  const h = state.hist;
  if (!h || h.key !== histKey() || !h.loaded) return el("div", { class: "h-note", text: "Loading…" });
  if (hist.selFor !== h.gatherer) { hist.sel = new Map(); hist.selFor = h.gatherer; hist.last = null; hist.panel = false; }
  const tree = histTree(h);
  const hasTasks = h.tasks.length > 0;
  if (hist.hadTasks && hist.hadTasks.key === h.key && !hist.hadTasks.had && hasTasks) {
    // tasks come in while the reader looks: the list stays as it is, and Group by tasks pulses a few times
    hist.flash = { key: h.key, until: Date.now() + 2600 };
    if (hist.group === null) hist.stay = { key: h.key };
    setTimeout(() => { hist.version++; histRedraw(); }, 2700);
  }
  hist.hadTasks = { key: h.key, had: hasTasks };
  const grouped = hasTasks && (hist.group ?? !(hist.stay && hist.stay.key === h.key));
  const vis = h.error ? [] : histVisible(tree, grouped);
  hist.flat = vis.map(([n, , head]) => n.id + (head ? "/h" : ""));
  histRows.begin(signature([h.key, [...histTypes]]));
  const shown = vis.slice(0, hist.limit);
  const list = el("div", { class: "h-list", "data-keep": `hist-list:${h.key}`, "data-morph": "" });
  const q = hist.q.trim();
  list.kids = h.error ? [el("div", { class: "h-note", text: h.error })]
    : !h.events.length ? [el("div", { class: "h-note", text: "No history yet." })]
    : hist.hits && !vis.length ? [el("div", { class: "h-note", text: `Nothing in this history matches “${q}”.` })]
    : [...shown.map(([n, depth, head]) => histRow(n, depth, head)),
      vis.length > shown.length ? el("button", { type: "button", class: "h-more", onclick: () => { hist.limit += HIST_SHOWN; hist.version++; histRedraw(); } },
        `Show ${full(Math.min(HIST_SHOWN, vis.length - shown.length))} more of ${full(vis.length - shown.length)}`) : null,
      h.more ? el("button", { type: "button", class: "h-more", onclick: async () => { await loadOutline(); histRedraw(); } }, "Load more of the history") : null].filter(Boolean);
  const left = el("div", { class: "h-left", "data-morph": "" }, histBar(h, grouped, hasTasks), list);
  return el("div", { class: "h-grid", "data-morph": "" }, left, histSide(h));
}
if (!SNAPSHOT) addChatView({
  id: "history", name: "History", feed: "outline", frame: "hist", chat: false, icon: ICONS.history,
  description: "The history, searched, and picked by actor, task, turn or message: exported, or given to the Gatherer's model to summarize, or to make a memory or a skill of.",
  render: histRender,
});

// What a view gets to draw with -- and, for one in a file of its own, how it adds itself.
const agDashboard = window.agDashboard = Object.freeze({
  chatView: addChatView,
  el, svgEl, markdown, clock, ago, full, compact, plural, firstLine,
  contextItem, columns, typeChips, itemType, transcriptBlocks, foldedOutput, notesSwitch, sizeCard, contextCard,
  statusOf, harnessName, harnessLogo, harnessBadge, actorLogo, backgroundNote, askingNote, errorNote,
});
// The reader's own views: each file in <home>/dashboard/views/, loaded once the page is up. One that
// does not load, or throws, is reported and left out.
async function loadOwnViews() {
  if (SNAPSHOT) return;
  let names = [];
  try { names = await get("/api/views"); } catch (err) { return; }
  for (const name of names) {
    await new Promise((done) => {
      const tag = document.createElement("script");
      tag.src = `/views/${encodeURIComponent(name)}`;
      tag.onload = done;
      tag.onerror = () => { console.error(`chat view ${name}: not loaded`); done(); };
      document.head.append(tag);
    });
  }
}

// ------------------------------------------------------------------ start
document.getElementById("pause").addEventListener("click", async (ev) => {
  state.paused = !state.paused;
  const b = ev.currentTarget;
  b.textContent = state.paused ? "Resume" : "Pause";
  b.title = state.paused ? "Update this page again" : "Stop updating this page; the agents and the server go on";
  if (!state.paused) await refresh(true);
  connect();
  if (state.paused) render();
});
if (SNAPSHOT) document.getElementById("pause").style.display = "none";
let resizeTimer = null;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => document.getElementById("size-chart") && state.agent && state.agent.reads && drawCharts(), 150); });
$("pane-close").addEventListener("click", () => PANE ? PANE.close(window) : closeHere());
if (PANE) document.addEventListener("pointerdown", () => PANE.focus(window), true);
else {
  $("pane-here").addEventListener("pointerdown", () => focusPane(panes.here), true);
  watchTop(document.querySelector("header .brand"), "brand");
  watchTop(document.getElementById("pane-head"), "here");
}
refresh(true).then(connect).then(() => { if (PANE) paneReady(); }).then(loadOwnViews);
if (!SNAPSHOT) setInterval(() => { if (!state.paused) render(); }, AGO_MS);
</script>
