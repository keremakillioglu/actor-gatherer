<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ag dashboard</title>
<style>
:root {
  color-scheme: light;
  --page: #f6f6f4; --surface: #fcfcfb; --side: #f4f4f2; --side-rule: var(--ring); --ink: #1d1d1b; --ink-2: #55544f; --muted: #898781;
  --grid: #e4e3dc; --axis: #c3c2b7; --ring: rgba(20,20,18,0.09); --wash: rgba(20,20,18,0.04);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --t-call: #1f8a3b; --t-output: #74c487; --t-gatherer: #e8b600;
  --good: #0ca30c; --warning: #fab219; --critical: #d03b3b; --selected: rgba(42,120,214,0.10);
  /* the Transcript view's terminal: the page's own surface, so the history is part of the page in either theme */
  --term-bg: var(--surface); --term-ink: #2b2a27; --term-dim: #6f6c65; --term-faint: #a09d95; --term-user: #efeee9; --term-ok: #2f9a4c;
  --term-err: #cf3a50; --term-run: #c08a00; --term-accent: #c4643f; --term-code: #f2f1ed; --term-rule: #e2e0d9; --term-box: #d6d4cc;
  --term-add: rgba(47,154,76,.12); --term-del: rgba(207,58,80,.10); --term-add-ink: #1b6b34; --term-del-ink: #a5293d; --term-link: #2468c8;
  --scroll: rgba(0,0,0,.16);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #111110; --surface: #1f1f1d; --side: #121211; --side-rule: rgba(255,255,255,0.14); --ink: #ecebe7; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --selected: rgba(57,135,229,0.16);
  --t-call: #2ea043; --t-output: #8fd19e; --t-gatherer: #f2cc3a;
  --term-bg: var(--surface); --term-ink: #e8e6e0; --term-dim: #8f8c84; --term-faint: #66635d; --term-user: #262522; --term-ok: #4eba65;
  --term-err: #ff6b80; --term-run: #e8b600; --term-accent: #d97757; --term-code: #222220; --term-rule: #2e2d2a; --term-box: #3a3935;
  --term-add: rgba(78,186,101,.16); --term-del: rgba(255,107,128,.16); --term-add-ink: #b6e8c0; --term-del-ink: #ffc2cb; --term-link: #7cb7ff;
  --scroll: rgba(255,255,255,.16);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #111110; --surface: #1f1f1d; --side: #121211; --side-rule: rgba(255,255,255,0.14); --ink: #ecebe7; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --selected: rgba(57,135,229,0.16);
  --t-call: #2ea043; --t-output: #8fd19e; --t-gatherer: #f2cc3a;
  --term-bg: var(--surface); --term-ink: #e8e6e0; --term-dim: #8f8c84; --term-faint: #66635d; --term-user: #262522; --term-ok: #4eba65;
  --term-err: #ff6b80; --term-run: #e8b600; --term-accent: #d97757; --term-code: #222220; --term-rule: #2e2d2a; --term-box: #3a3935;
  --term-add: rgba(78,186,101,.16); --term-del: rgba(255,107,128,.16); --term-add-ink: #b6e8c0; --term-del-ink: #ffc2cb; --term-link: #7cb7ff;
  --scroll: rgba(255,255,255,.16);
}
* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--scroll) transparent; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  height: 100vh; display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--ring); background: var(--surface); flex: none; z-index: 2; }
header h1 { font-size: 16px; margin: 0; font-weight: 600; white-space: nowrap; }
/* the page's name and home, and under them, small, whether it is live (and its pause) */
header .brand { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: baseline; column-gap: 12px; row-gap: 1px; flex: 0 1 auto; min-width: 0; }
header .home { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
/* a small button under the name: the page's state at a glance (its dot), and a panel with the dashboard's own details */
header .about-wrap { grid-column: 1 / -1; position: relative; justify-self: start; }
header .about-btn { border: 0; background: none; padding: 0 4px 0 0; font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
header .about-btn:hover, header .about-btn[aria-expanded="true"] { color: var(--ink); background: none; }
.state-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--axis); display: inline-block; flex: none; }
.state-dot[data-state="live"] { background: var(--good); } .state-dot[data-state="error"] { background: var(--critical); }
.state-dot[data-state="paused"] { background: var(--warning); }
.about { position: absolute; top: calc(100% + 6px); left: 0; z-index: 5; width: 340px; background: var(--surface); border: 1px solid var(--ring);
  border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.12); padding: 12px 14px; font-size: 12px; display: grid; gap: 10px; }
.about[hidden] { display: none; }
.about h4 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
.about .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.about .live { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); min-width: 0; overflow-wrap: anywhere; }
.about .servers { padding: 0; white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
/* the selected actor's controls: how its history is shown, and its details */
/* they take the room right of the page's name, wrapping there when they need more */
header .controls { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; justify-content: flex-end; flex: 1 1 0; min-width: 0; }
header .controls:empty { visibility: hidden; }
header .details-btn { display: inline-flex; align-items: center; gap: 6px; }
header .details-btn[aria-expanded="true"] { background: var(--selected); border-color: transparent; }
button { font: inherit; font-size: 12px; color: var(--ink); background: var(--surface); border: 1px solid var(--ring); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { background: var(--wash); }
/* the page is the screen's height: the agent list and the chat each scroll in their own place */
.layout { display: grid; grid-template-columns: 320px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); flex: 1; min-height: 0; }
aside { border-right: 1px solid var(--side-rule); background: var(--side); padding: 12px 0; overflow-y: auto; }
aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 16px 6px; font-weight: 600; }
.gatherer { padding: 6px 0 8px; border-top: 1px solid var(--grid); }
.gatherer-row { display: flex; align-items: stretch; }
.gatherer-row .name { flex: 1; min-width: 0; padding: 6px 4px 6px 12px; display: flex; align-items: center; gap: 8px;
  border: 0; border-radius: 0; background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.gatherer-row .name:hover { background: var(--wash); }
.gatherer-row .name:focus-visible { outline: 2px solid var(--axis); outline-offset: -2px; }
.gatherer-row .caret { display: inline-block; width: 10px; color: var(--muted); font-size: 10px; transition: transform .15s; }
.gatherer-row .name[aria-expanded="true"] .caret { transform: rotate(90deg); }
.gatherer-row .gname { font-size: 14px; font-weight: 600; letter-spacing: -.005em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.gatherer-row .count { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ink-2);
  background: var(--wash); border-radius: 999px; padding: 1px 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.gatherer-row .count i { width: 6px; height: 6px; border-radius: 50%; background: var(--good); display: inline-block; }
.gatherer-row .act { border: 0; border-radius: 6px; background: none; color: var(--muted); padding: 0 8px; margin: 2px 0; line-height: 1;
  display: inline-flex; align-items: center; }
.gatherer-row .act:last-child { margin-right: 8px; }
.gatherer-row .act:hover { color: var(--ink); background: var(--wash); }
.gatherer-row .act.hide { opacity: 0; }
.gatherer-row:hover .act.hide, .gatherer-row .act.hide:focus-visible { opacity: 1; }
@media (hover: none) { .gatherer-row .act.hide { opacity: 1; } }
.agent-group { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 6px 18px 2px 40px; }
button.agent-group { display: block; width: 100%; text-align: left; background: none; border: 0; cursor: pointer; font-family: inherit; }
button.agent-group:hover { color: var(--ink-2); }
.agent { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; text-align: left; border: 0; border-radius: 8px;
  background: none; padding: 8px 10px; margin: 2px 8px; width: calc(100% - 16px); cursor: pointer; color: var(--ink); }
.agent:hover { background: var(--wash); }
.agent[aria-current="true"] { background: var(--selected); }
.agent .logo { width: 22px; height: 22px; margin-top: 1px; display: block; }
.agent .asked { font-size: 13px; line-height: 1.4; font-weight: 500; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  overflow: hidden; overflow-wrap: anywhere; }
.agent .asked.none { color: var(--muted); font-weight: 400; font-style: italic; }
.agent .meta { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.agent .meta .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--axis); flex: none; }
.agent .meta .dot.running { background: var(--good); } .agent .meta .dot.building { background: var(--warning); } .agent .meta .dot.failed { background: var(--critical); }
.agent .meta .dot.finished { background: var(--s1); }
.agent .meta .dot.closed { background: none; box-shadow: inset 0 0 0 1.5px var(--axis); }
.hidden-list { border-top: 1px solid var(--grid); padding: 8px 0 4px; }
.hidden-list > summary { margin: 0; padding: 4px 16px; font-size: 12px; color: var(--muted); list-style: none; }
.hidden-list > summary::-webkit-details-marker { display: none; }
.hidden-list > summary:hover { color: var(--ink-2); }
.hidden-row { display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 34px; font-size: 13px; }
.hidden-row .gname { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.hidden-row .why { color: var(--muted); font-size: 12px; white-space: nowrap; }
.hidden-row button { margin-left: auto; }
.status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.status i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--axis); }
.status.running i { background: var(--good); }
.status.building i { background: var(--warning); }
.status.finished i { background: var(--s1); }
.status.failed i { background: var(--critical); }
.status.closed i { background: none; box-shadow: inset 0 0 0 1.5px var(--axis); }
.servers { color: var(--ink-2); font-size: 12px; }
main { padding: 0; min-width: 0; min-height: 0; display: flex; position: relative; overflow: hidden; }
.empty { color: var(--muted); padding: 40px; text-align: center; }
.title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.title h2 { margin: 0; font-size: 18px; font-weight: 600; }
.title .sub { color: var(--muted); font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 12px 14px; }
.tile .label { color: var(--ink-2); font-size: 12px; }
.tile .value { font-size: 22px; font-weight: 600; margin-top: 2px; }
.tile .note { color: var(--muted); font-size: 12px; margin-top: 2px; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; min-width: 0; }
.card h3 { margin: 0 0 2px; font-size: 14px; font-weight: 600; }
.card .desc { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.key-line { width: 14px; height: 2px; border-radius: 1px; display: inline-block; }
.key-rect { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.key-rule { width: 1px; height: 12px; display: inline-block; background: var(--muted); }
.chart { position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.tooltip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12); min-width: 170px; z-index: 3; display: none; }
.tooltip .t { color: var(--muted); margin-bottom: 4px; }
.tooltip .row { display: flex; align-items: center; gap: 8px; }
.tooltip .row b { font-weight: 600; min-width: 64px; }
.tooltip .row span { color: var(--ink-2); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 1100px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 760px) { body { height: auto; display: block; } .layout { display: block; } aside { max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--ring); }
  main { overflow: visible; } }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { text-align: left; color: var(--muted); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
td { padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.total td { font-weight: 600; border-bottom: 0; }
.scroll { overflow-x: auto; }
.tall { max-height: 420px; overflow-y: auto; }
.desc-cell { color: var(--ink-2); max-width: 520px; }
.bar { height: 8px; border-radius: 0 4px 4px 0; background: var(--s1); display: inline-block; vertical-align: middle; }
.stack { display: flex; height: 18px; gap: 2px; margin: 8px 0 10px; }
.stack div { height: 100%; }
.stack div:first-child { border-radius: 4px 0 0 4px; } .stack div:last-child { border-radius: 0 4px 4px 0; }
.stack div:only-child { border-radius: 4px; }
details summary { cursor: pointer; color: var(--ink-2); font-size: 12px; margin-top: 8px; }
.tasks { border-top: 1px solid var(--grid); }
.tasks .thead, .task > summary { display: grid; grid-template-columns: 32px minmax(140px, 220px) minmax(0, 1fr) 150px 60px 96px; gap: 12px;
  padding: 7px 8px; font-size: 12px; align-items: start; }
.tasks .thead { color: var(--muted); border-bottom: 1px solid var(--grid); }
.task > summary { margin: 0; color: var(--ink); cursor: pointer; border-bottom: 1px solid var(--grid); list-style: none; }
.task > summary::-webkit-details-marker { display: none; }
.task > summary:hover { background: var(--wash); }
.task[open] > summary { background: var(--selected); }
.task .tname { font-weight: 500; }
.task .badge { display: inline-block; font-size: 11px; font-weight: 600; color: var(--s1); border: 1px solid currentColor; border-radius: 999px;
  padding: 0 7px; margin-right: 6px; line-height: 16px; vertical-align: 1px; }
.task .tnote { display: block; color: var(--muted); margin-top: 2px; }
.task .n, .tasks .thead .n { text-align: right; font-variant-numeric: tabular-nums; }
.task .messages { padding: 4px 0 10px 44px; }
@media (max-width: 760px) { .tasks .thead { display: none; } .task > summary { grid-template-columns: 24px minmax(0, 1fr); }
  .task > summary > span:nth-child(n+3) { grid-column: 2; } .task .messages { padding-left: 0; } }
.card-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.decomp { position: relative; margin: 6px 0 14px; display: grid; gap: 8px; }
.drow { display: grid; grid-template-columns: 210px minmax(0, 1fr); align-items: center; gap: 12px; }
.drow .dzero { grid-column: 2; color: var(--muted); font-size: 11px; margin-top: -4px; }
.dlabel { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ink-2); }
.dlabel .dval { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.dbar { height: 22px; display: flex; }
.dinner { display: flex; gap: 2px; height: 100%; }
.dbar > .seg + .seg, .dbar > .dinner + .dinner { margin-left: 2px; }
.seg { height: 100%; min-width: 2px; display: flex; align-items: center; overflow: hidden; cursor: default; outline-offset: 2px; }
.seg:first-child { border-radius: 4px 0 0 4px; } .seg:last-child { border-radius: 0 4px 4px 0; } .seg:only-child { border-radius: 4px; }
.seg:hover, .seg:focus-visible { filter: brightness(1.08); }
.seg span { font-size: 11px; padding: 0 6px; white-space: nowrap; pointer-events: none; }
@media (max-width: 760px) { .drow { grid-template-columns: minmax(0, 1fr); gap: 4px; } .drow .dzero { grid-column: 1; } }
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 4px 0 10px; }
.filters .label { color: var(--muted); font-size: 12px; margin-right: 4px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; color: var(--ink-2); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.chip[aria-pressed="false"] { color: var(--muted); background: none; }
.chip[aria-pressed="false"] .dot { opacity: .35; }
.chip[aria-pressed="true"] { background: var(--selected); border-color: transparent; color: var(--ink); }
.ctx { max-height: 520px; overflow-y: auto; border-top: 1px solid var(--grid); }
.ctx .cols { display: grid; grid-template-columns: 3px minmax(90px, 150px) minmax(0, 1fr) auto; gap: 10px; height: 26px; align-items: center;
  padding: 0 4px; font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--grid); position: sticky; top: 0; background: var(--surface); z-index: 2; }
.ctx .cols .n { text-align: right; }
.ctx .run { display: flex; align-items: center; gap: 8px; padding: 10px 4px 4px; font-size: 12px; position: sticky; top: 26px; background: var(--surface); z-index: 1; }
.ctx .run span:last-child { color: var(--muted); }
.ctx .item summary { display: grid; grid-template-columns: 3px minmax(90px, 150px) minmax(0, 1fr) auto; gap: 10px; align-items: center;
  margin: 0; padding: 5px 4px; border-bottom: 1px solid var(--grid); color: var(--ink); list-style: none; }
.ctx .item summary::-webkit-details-marker { display: none; }
.ctx .item summary:hover { background: var(--wash); }
.ctx .bar-key { width: 3px; height: 16px; border-radius: 2px; }
.ctx .kind { font-size: 12px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctx .preview { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.ctx .preview.none { color: var(--muted); }
.ctx .uncounted { font-size: 12px; color: var(--muted); padding: 4px 4px 10px 17px; }
.ctx .n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ctx pre { margin: 0; padding: 10px 12px 12px 17px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap;
  overflow-wrap: anywhere; color: var(--ink-2); background: var(--page); border-bottom: 1px solid var(--grid); max-height: 360px; overflow-y: auto; }
.warn { color: var(--ink-2); font-size: 12px; margin-top: 8px; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.stale { opacity: .55; transition: opacity .2s; }
/* The Transcript view: the conversation as a terminal shows it, in the page's theme (the --term-* colors above) */
.term {
  background: var(--term-bg); color: var(--term-ink); border-radius: 10px; border: 1px solid var(--ring);
  font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; padding: 14px 18px 18px;
  overflow-y: auto; overflow-x: hidden; }

// ------------------------------------------------------------------ charts
function lineChart(host, { reads, series, height = 220, rebuilds = true, step = false, onPick, picked }) {
  host.replaceChildren();
  const box = el("div", { class: "chart" });
  host.append(box);
  const W = Math.max(320, host.clientWidth || 640), H = height, m = { l: 48, r: 12, t: 12, b: 26 };
  const xs = reads.map((r) => r.at).filter((t) => t);
  if (!xs.length) { box.append(el("div", { class: "desc", text: "No reads yet." })); return; }
  let x0 = Math.min(...xs), x1 = Math.max(...xs);
  if (x1 === x0) { x0 -= 30; x1 += 30; }
  const vals = series.flatMap((s) => reads.map((r) => r[s.field]).filter((v) => typeof v === "number"));
  let ymax = Math.max(1, ...vals);
  const stepY = Math.max(1, niceStep(ymax / 4)); ymax = Math.ceil(ymax / stepY) * stepY;
  const X = (t) => m.l + (t - x0) / (x1 - x0) * (W - m.l - m.r), Y = (v) => H - m.b - v / ymax * (H - m.t - m.b);
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img" });
  for (let v = 0; v <= ymax + 1e-9; v += stepY) {
    svg.append(svgEl("line", { x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), stroke: v === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
    const t = svgEl("text", { x: m.l - 6, y: Y(v) + 4, "text-anchor": "end" }); t.textContent = compact(v); svg.append(t);
  }
  const days = (x1 - x0) > 86400;
  const ticks = Math.max(2, Math.min(6, Math.floor((W - m.l - m.r) / 110)));
  for (let i = 0; i <= ticks; i++) {
    const t = x0 + (x1 - x0) * i / ticks;
    const lab = svgEl("text", { x: X(t), y: H - 8, "text-anchor": i === 0 ? "start" : i === ticks ? "end" : "middle" });
    lab.textContent = axisTime(t, days, (x1 - x0) < 600); svg.append(lab);
  }
  if (rebuilds) for (const r of reads) if (r.rebuild && r.at)
    svg.append(svgEl("line", { x1: X(r.at), x2: X(r.at), y1: m.t, y2: H - m.b, stroke: "var(--muted)", "stroke-width": 1, opacity: .7 }));
  for (const s of series) {
    const pts = reads.filter((r) => typeof r[s.field] === "number" && r.at);
    if (!pts.length) continue;
    let d = "";
    pts.forEach((r, i) => {
      const x = X(r.at), y = Y(r[s.field]);
      if (i === 0) d += `M${x},${y}`;
      else if (step) d += `H${x}V${y}`; else d += `L${x},${y}`;
    });
    svg.append(svgEl("path", { d, fill: "none", stroke: s.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    const last = pts[pts.length - 1];
    svg.append(svgEl("circle", { cx: X(last.at), cy: Y(last[s.field]), r: 4, fill: s.color, stroke: "var(--surface)", "stroke-width": 2 }));
  }
  if (picked) {
    const r = reads.find((q) => q.read_id === picked);
    if (r && r.at) svg.append(svgEl("line", { x1: X(r.at), x2: X(r.at), y1: m.t, y2: H - m.b, stroke: "var(--s1)", "stroke-width": 1 }));
  }
  const cross = svgEl("line", { y1: m.t, y2: H - m.b, stroke: "var(--axis)", "stroke-width": 1, visibility: "hidden" });
  svg.append(cross);
  const hit = svgEl("rect", { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: "transparent", style: onPick ? "cursor:pointer" : "" });
  svg.append(hit);
  box.append(svg);
  const tip = el("div", { class: "tooltip" });
  box.append(tip);
  const nearest = (ev) => {
    const rect = svg.getBoundingClientRect();
    const px = (ev.clientX - rect.left) * W / rect.width;
    const t = x0 + (px - m.l) / (W - m.l - m.r) * (x1 - x0);
    let best = null;

    return { best, rect };
  };
  hit.addEventListener("pointermove", (ev) => {
    const { best, rect } = nearest(ev);
    if (!best) return;
    cross.setAttribute("x1", X(best.at)); cross.setAttribute("x2", X(best.at)); cross.setAttribute("visibility", "visible");
    tip.replaceChildren(el("div", { class: "t", text: `${clock(best.at, days)} · read ${best.read_id}${best.rebuild ? " · rebuild" : ""}` }));
    for (const s of series) tip.append(el("div", { class: "row" }, el("span", { class: "key-line", style: `background:${s.color}` }),
      el("b", { text: s.format ? s.format(best[s.field]) : full(best[s.field]) }), el("span", { text: s.label })));
    tip.style.display = "block";
    const left = X(best.at) / W * rect.width;

    tip.style.top = "8px";

  hit.addEventListener("pointerleave", () => { cross.setAttribute("visibility", "hidden"); tip.style.display = "none"; });

  box.checked = showNotes;
  box.addEventListener("change", () => {
    showNotes = box.checked;
    try { localStorage.setItem(NOTES_KEY, showNotes ? "1" : "0"); } catch (e) { /* this page only */ }
    keepingPlace(renderMain);
  });
  return el("label", { title: "The harness's system messages and ag's own notices, between the messages" }, box, "Show system and ag notes");
}
// ------------------------------------------------------------------ chat views
// How the chat shows an actor's history: one VIEW of several, the reader's choice (kept in this
// browser). A view names the FEED it draws from and draws it; the tab loads that feed, gives the view a
// frame that follows its newest, and adds what waits to be sent and the box to write the next (for an actor
// that can be messaged here).
//
// A view is added with agDashboard.chatView({...}): here, or from a file of its own in
// <home>/dashboard/views/*.js, which the page loads when it starts (server.py: /api/views):
//
//   agDashboard.chatView({
//     id: "bubbles",                    // unique; the reader's choice is kept by it
//     name: "Bubbles",                  // on the switch
//     description: "User and assistant messages only.",
//     feed: "history",                  // what it draws (CHAT_FEEDS): "history", the gatherer's events --
//                                       // {row_id, name (its type), text, tokens, at, clipped};
//                                       // "transcript", each event's parts as the Transcript view draws
//                                       // them -- {row_id, type, at, parts: [{kind, role, text, ...}]};
//                                       // or "none", for a view that is not the history (the Terminal)
//     frame: "ctx",                     // the frame's class: "ctx" (the list's), "term" (the terminal's), or your own
//     tools(ctx) { return [nodes] },    // optional: controls in the page's header (filters, switches)
//     render(ctx) { return node or [nodes] },
//     composer(ctx) { return node },    // optional: the box to write the next message, under the frame;
//                                       // without it, a text box and a Send button (defaultComposer)
//     footer(ctx) { return node },      // optional: under the message box, at the bottom of the page
//   });
//
// `ctx`: {info (the actor), session (its row: status, cwd, ...), data: {items, pending (what the model
// answered that no call has stored yet: row_id null), earlier (older items not loaded)}, running,
// queued, held (why the session cannot be messaged here -- another process has it open -- or ""),
// loadEarlier(), rerender(), api (agDashboard: el, markdown, the page's other helpers)}, and for
// a composer: input(attrs), the text box to build it around (Enter sends, Shift+Enter a new line, what
// is typed kept across redraws), and send(text), which sends it, clears the box, and shows an error
// under the composer when the send fails (true when it was sent). Controls marked data-send are
// disabled while a message is being sent, and while the session is held. A view that throws is shown as having failed; the others
// still work.
const CHAT_VIEWS = new Map();
const CHAT_VIEW_KEY = "ag-dashboard-chat-view";
let chatViewId = (() => { try { return localStorage.getItem(CHAT_VIEW_KEY) || "transcript"; } catch (e) { return "transcript"; } })();
const chatView = () => CHAT_VIEWS.get(chatViewId) || CHAT_VIEWS.get("transcript");
async function setChatView(id) {
  chatViewId = id;
  try { localStorage.setItem(CHAT_VIEW_KEY, id); } catch (e) { /* this page only */ }
  await loadChat();
  keepingPlace(renderMain);
  chatToEnd();
}
function addChatView(view) {
  if (!view || typeof view.id !== "string" || typeof view.render !== "function")
    throw new Error("a chat view needs an id and a render(ctx)");
  if (!CHAT_FEEDS[view.feed || "history"]) throw new Error(`no feed ${view.feed}: one of ${Object.keys(CHAT_FEEDS).join(", ")}`);
  CHAT_VIEWS.set(view.id, { name: view.id, feed: "history", ...view });
  if (state.home) { drawn.main = null; loadChat().then(() => render()); }
}
// What a view can draw from: each loads its data for the selected session, and says what it has.
const CHAT_FEEDS = {
  history: {
    load: loadChatHistory,
    data: () => state.chat && state.selected && state.chat.key === key(...state.selected)
      ? { items: state.chat.items, pending: state.chat.pending, earlier: false } : null,
  },
  transcript: {
    load: () => loadTranscript(),
    loadEarlier: () => loadTranscript(true),
    data: () => state.tx && state.selected && state.tx.key === key(...state.selected)
      ? { items: state.tx.items, pending: state.tx.pending, earlier: state.tx.earlier } : null,
  },
  none: { load: async () => {}, data: () => ({ items: [], pending: [], earlier: false }) },
};
// "agent": what ag recorded of the actor's calls -- each read (items), and the context the chart has picked
// (state.context) -- loaded with the actor already.
CHAT_FEEDS.agent = {
  load: async () => {},
  data: () => state.agent && state.agent.reads ? { items: state.agent.reads, pending: [], earlier: false } : null,
};
const chatFeed = (view = chatView()) => CHAT_FEEDS[view.feed] || CHAT_FEEDS.history;

// The views that come with the page.
addChatView({
  id: "messages", name: "Messages", feed: "history", frame: "ctx",
  description: "The session's events as the gatherer has them, one row each, filtered by type.",
  tools: () => typeChips(null),
  render: ({ data }) => {
    const items = [...data.items, ...data.pending].map((i) => ({ ...i, group: "Recent history" }));
    const listed = items.filter((it) => shownTypes.has(itemType(it)[0]));
    return [columns(), el("div", { class: "run" }, el("strong", { text: "Messages" }),
      el("span", { text: tally(items.length, listed.length, items.reduce((n, i) => n + i.tokens, 0), listed.reduce((n, i) => n + i.tokens, 0), "message") })),
      ...listed.map(contextItem)];
  },
});
addChatView({
  id: "transcript", name: "Transcript", feed: "transcript", frame: "term",
  description: "The conversation as Claude Code's terminal shows it.",
  tools: () => notesSwitch(),
  render: ({ info, data, running, loadEarlier }) => {
    state.txCwd = info.cwd || "";
    return [
      data.earlier ? el("button", { type: "button", class: "earlier", onclick: loadEarlier }, "Load earlier messages") : null,
      ...transcriptBlocks([...data.items, ...data.pending], running),
      running ? el("div", { class: "status-line" }, el("span", { class: "spin", "aria-hidden": "true" }), `Working… (last activity ${ago(info.last)})`) : null,
    ].filter(Boolean);
  },
  composer: (ctx) => {
    const box = ctx.input({ rows: "1", placeholder: ctx.running ? "Write the next message: it waits for the turn to end" : "Message the agent",
      "data-send": "1", spellcheck: "false" });
    const grow = () => { box.style.height = "auto"; box.style.height = `${box.scrollHeight}px`; };   // where field-sizing is not known
    box.addEventListener("input", grow);
    return el("div", { class: "term-prompt" },
      el("label", { class: "box" }, el("span", { class: "g", text: "❯" }), box),
      el("div", { class: "foot" },
        el("span", {}, el("span", { class: "mode", text: `» ${ctx.session.permission_mode}` }), ` · ${ctx.session.cwd}`),
        el("span", { text: "enter to send · shift+enter for a new line" })));
  },
});
addChatView({
  id: "context", name: "Context", feed: "agent", frame: "ctx",
  description: "What the model was sent: the picked call's context, item by item; its size over time and how it divides, under the message box.",
  tools: () => {
    const ctx = state.agent && state.agent.reads ? pickedContext() : null;
    return [ctx && ctx.items ? contextChips(ctx) : null,
      state.followLatest ? null : el("button", { type: "button", title: `Read ${state.readId} is shown`, onclick: backToLatest }, "Back to the latest")];
  },
  render: ({ data }) => {
    const ctx = data.items.length ? pickedContext() : null;
    if (!ctx || !ctx.items) return el("div", { class: "desc", text: (state.agent && state.agent.error) || "No context sent yet." });
    return [columns(), ...contextRuns(ctx)];
  },
  footer: ({ data }) => {
    const reads = data.items;
    if (!reads.length) return null;
    const hasReal = reads.some((r) => typeof r.real_tokens === "number");
    const ctx = pickedContext();
    return el("div", { class: "ctx-panel" },
      el("div", { class: "ctx-panel-head" },
        el("strong", { text: state.followLatest ? "Context size" : `Context size · read ${state.readId}` }),
        ctx && ctx.items ? el("span", { class: "sub", text: `${compact(ctx.real_tokens ?? ctx.tokens)} tokens ${state.followLatest ? "now" : "at that call"}` }) : null,
        legend([...(hasReal ? [{ label: "Provider's count", color: "var(--s1)" }] : []), { label: "ag's own count", color: "var(--s2)" },
          { label: "Rebuild", kind: "rule" }])),
      el("div", { id: "size-chart", "data-height": "120", title: "Click a call to see its context" }),
      ctx && ctx.items ? contextSplit(ctx, true) : null);
  },
});

// ------------------------------------------------------------------ the Terminal view
// The session in Claude Code's own UI: its interactive process, run by the dashboard in a
// pseudo-terminal (sessions.py's `terminal`), drawn by xterm.js. The terminal keeps one node across
// the tab's draws (moved, never made again), so what it shows, its scroll and its focus stay. Showing a
// session in the view opens its terminal, once each time the session is chosen: one that exits or fails
// to open is not opened again until asked (a button). Once open it has the session -- the other views'
// message boxes type into it -- until it is closed (the list's close button) or exits.
// The terminal's colors: the page's terminal colors, and a 16-color palette for each theme made from them.
const XTERM_ANSI = {
  dark: { black: "#3a3935", red: "#ff6b80", green: "#4eba65", yellow: "#e8b600", blue: "#7cb7ff", magenta: "#e58fb6", cyan: "#4fc1c9", white: "#c3c2b7",
    brightBlack: "#8f8c84", brightRed: "#ff8fa0", brightGreen: "#7fd492", brightYellow: "#f2cc3a", brightBlue: "#a6cdff", brightMagenta: "#f0a8c8",
    brightCyan: "#7fd8de", brightWhite: "#ecebe7", selectionBackground: "rgba(124,183,255,.28)" },
  light: { black: "#2b2a27", red: "#cf3a50", green: "#2f9a4c", yellow: "#a87700", blue: "#2468c8", magenta: "#b8437a", cyan: "#13858d", white: "#a09d95",
    brightBlack: "#6f6c65", brightRed: "#a5293d", brightGreen: "#1b6b34", brightYellow: "#8a6200", brightBlue: "#1a4f9c", brightMagenta: "#8f2f5d",
    brightCyan: "#0e6870", brightWhite: "#55544f", selectionBackground: "rgba(36,104,200,.20)" },
};
function xtermTheme() {
  const css = getComputedStyle(document.documentElement), v = (n) => css.getPropertyValue(n).trim();
  const ink = v("--term-ink");
  return { ...XTERM_ANSI[css.colorScheme === "dark" ? "dark" : "light"], background: v("--term-bg"), foreground: ink, cursor: ink, cursorAccent: v("--term-bg") };
}
window.addEventListener("ag-theme", () => { if (term.xterm) term.xterm.options.theme = xtermTheme(); });
const term = { sid: null, xterm: null, fit: null, host: null, es: null, opened: false, exited: null, unsent: "", sending: false, error: "", tried: false };
function termFor(sid) {
  if (term.sid === sid && term.xterm) return term;
  termDrop();
  const xterm = new Terminal({ cursorBlink: true, fontSize: 13, scrollback: 5000, allowProposedApi: false,
    fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace', theme: xtermTheme() });
  const fit = new FitAddon.FitAddon();
  xterm.loadAddon(fit);
  const host = el("div", { class: "xterm-host", id: "xterm-host", "data-refocus": "1" });
  host.agFocus = () => xterm.focus();
  Object.assign(term, { sid, xterm, fit, host, opened: false, exited: null, error: "", tried: false });
  xterm.onData((d) => termType(sid, d));
  xterm.onResize(({ cols, rows }) => {
    if (termRunning(sid)) post("/api/terminal/resize", { session_id: sid, cols, rows }).catch(() => {});
  });
  new ResizeObserver(() => { if (host.isConnected && host.clientWidth) { try { fit.fit(); } catch (e) { /* not shown yet */ } } }).observe(host);
  return term;
}
function termDrop() {
  if (term.es) term.es.close();
  if (term.xterm) term.xterm.dispose();
  Object.assign(term, { sid: null, xterm: null, fit: null, host: null, es: null, opened: false, exited: null, unsent: "", tried: false });
}
const termRunning = (sid) => { const info = selectedInfo(); return !!(info && info.channel === sid && info.session && info.session.terminal); };
// What is typed, to the process, in order: one request at a time (two at once could arrive swapped), and
// what is typed while one is on its way goes together in the next -- fast typing is a few requests, not a queue.
function termType(sid, data) {
  if (!termRunning(sid)) return;
  term.unsent += data;
  if (!term.sending) termSend();
}
async function termSend() {
  term.sending = true;
  while (term.unsent && term.sid) {                  // each batch to the terminal shown when it goes
    const data = term.unsent, sid = term.sid;
    term.unsent = "";
    try { await post("/api/terminal/input", { session_id: sid, data }); } catch (err) { /* the terminal is gone: its end shows */ }
  }
  term.sending = false;
}
// What the process prints: everything kept at first (a page that comes back sees the screen), then as it comes.
function termListen(sid) {
  if (term.es || SNAPSHOT) return;
  const es = new EventSource(`/api/terminal?session_id=${encodeURIComponent(sid)}`);
  term.es = es;
  const mine = () => term.es === es && term.sid === sid;
  es.addEventListener("out", (ev) => {
    if (!mine()) return;
    const got = JSON.parse(ev.data);
    if (got.reset) term.xterm.reset();
    term.xterm.write(Uint8Array.from(atob(got.data), (c) => c.charCodeAt(0)));
  });
  const ended = (ev) => {
    if (!mine()) return;
    es.close(); term.es = null;
    if (ev.type === "exit") { term.exited = JSON.parse(ev.data).code; term.xterm.write("\r\n\x1b[2m[the session's process ended]\x1b[0m\r\n"); }
    refresh();
  };
  es.addEventListener("exit", ended);
  es.addEventListener("none", ended);
}
async function termOpen(info) {
  const t = termFor(info.channel);
  t.tried = true;
  const dims = (t.fit && t.fit.proposeDimensions()) || { cols: 120, rows: 32 };
  t.error = ""; t.exited = null;
  try {
    await post("/api/terminal", { ...(info.session ? { session_id: info.session.session_id } : { gatherer: state.selected[0], channel: info.channel }),
      cols: dims.cols, rows: dims.rows });
    t.xterm.reset();
  } catch (err) { t.error = err.message; }
  await refresh();
  if (termRunning(info.channel) && (t.xterm.cols !== dims.cols || t.xterm.rows !== dims.rows))   // fitted again meanwhile
    post("/api/terminal/resize", { session_id: info.channel, cols: t.xterm.cols, rows: t.xterm.rows }).catch(() => {});
  t.xterm.focus();
}
if (!SNAPSHOT && window.Terminal && window.FitAddon) addChatView({
  id: "terminal", name: "Terminal", feed: "none", frame: "xterm-frame",
  description: "Claude Code's own interface, in a terminal: what it would show and ask in one outside, its keys included.",
  render: (ctx) => {
    const { info, held } = ctx;
    if (state.home && state.home.terminals === false)
      return el("div", { class: "xterm-cover" }, el("div", { class: "desc", text: "A terminal needs a Unix pseudo-terminal, which the dashboard's system does not have." }));
    const t = termFor(info.channel), running = !!(info.session && info.session.terminal);
    if (running) termListen(info.channel);
    const open = !running && !held && !t.tried && hasChat(info);
    if (open) t.tried = true;
    requestAnimationFrame(() => {                      // drawn into the page: opened there once, then fitted to it
      if (!t.host.isConnected) return;
      if (!t.opened) { t.xterm.open(t.host); t.opened = true; }
      try { t.fit.fit(); } catch (e) { /* not shown */ }
      if (open) termOpen(info);                        // the session's terminal, at the size it was just fitted to
    });
    const cover = running ? null : el("div", { class: "xterm-cover" },
      el("div", { class: "desc", text: held || (!hasChat(info) ? "This session cannot be opened from the dashboard."
        : t.exited !== null ? "The session's process ended." : t.error ? "The terminal did not open." : "Opening the terminal…") }),
      held || !hasChat(info) || (!t.error && t.exited === null) ? null
        : el("button", { type: "button", class: "primary", onclick: () => termOpen(info) }, "Open again"),
      t.error ? el("div", { class: "err", text: t.error }) : null);
    return [t.host, cover].filter(Boolean);
  },
  composer: () => [],
});

// What a view gets to draw with -- and, for one in a file of its own, how it adds itself.
const agDashboard = window.agDashboard = Object.freeze({
  chatView: addChatView,
  el, svgEl, markdown, clock, ago, full, compact, plural, firstLine,
  contextItem, columns, typeChips, itemType, transcriptBlocks, foldedOutput, notesSwitch, sizeCard, contextCard,
  statusOf, harnessName, harnessLogo,
});
// The reader's own views: each file in <home>/dashboard/views/, loaded once the page is up. One that
// does not load, or throws, is reported and left out.
async function loadOwnViews() {
  if (SNAPSHOT) return;
  let names = [];
  try { names = await get("/api/views"); } catch (err) { return; }
  for (const name of names) {
    await new Promise((done) => {
      const tag = document.createElement("script");
      tag.src = `/views/${encodeURIComponent(name)}`;
      tag.onload = done;
      tag.onerror = () => { console.error(`chat view ${name}: not loaded`); done(); };
      document.head.append(tag);
    });
  }
}

// ------------------------------------------------------------------ start
document.getElementById("pause").addEventListener("click", async (ev) => {
  state.paused = !state.paused;
  const b = ev.currentTarget;
  b.textContent = state.paused ? "Resume" : "Pause";
  b.title = state.paused ? "Update this page again" : "Stop updating this page; the agents and the server go on";
  if (!state.paused) await refresh(true);
  connect();
  if (state.paused) render();
});
if (SNAPSHOT) document.getElementById("pause").style.display = "none";
let resizeTimer = null;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => document.getElementById("size-chart") && state.agent && state.agent.reads && drawCharts(), 150); });
refresh(true).then(connect).then(loadOwnViews);
if (!SNAPSHOT) setInterval(() => { if (!state.paused) render(); }, AGO_MS);
</script>
