# What each actor says before its first message: in the dashboard's Chat view, under its avatar waving.
# Read by the dashboard as it runs (ag_dashboard/avatars.py): change a line here and it shows from the next
# update, or reload the page -- nothing to restart or redraw.
#
# One entry per character, by its picture's name (ag_dashboard/avatars/<kind>/<name>.svg): one drawn in every
# hue ("daruma-red", "daruma-blue", ...) by its name without the hue ("daruma"). Its lines, any number of them:
# each new actor is given one and keeps it -- with four, at random, the next actor another, all four coming round
# in turn. A line over several lines (a haiku) is a multi-line string, its lines shown as they are.
#
# The drawn ones have four each, one of each style: playful, in its own voice about itself; plain, its name and
# the ask; its sound, then "Ready when you are."; and a haiku, 5-7-5.

